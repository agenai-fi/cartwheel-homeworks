<!doctype html>
<meta charset="utf-8">
<title>Cartwheel review</title>
<!--
  Visual encoding follows the error-discovery skill's Phase 2, adapted to the
  trace structure observed over 11 live traces:

    colour hue   segment author: user / assistant / tool call / tool result
    container    a tool call and its result share one bordered box
    spacing      tight within a step, medium between steps, large between turns
    typography   prose proportional; tool payloads monospace; reasoning italic

  Two decisions that are not the reference's:

  * THE REPLY IS STICKY. All four failure shapes found by hand live between a
    reply claim and evidence elsewhere on the page, so the reply stays visible
    while its tool activity scrolls.
  * THE EVIDENCE RAIL IS ALWAYS OPEN. Ground truth from the database, anomalies
    flagged, and policy ids retrieved versus cited. Facts only -- never the
    expected outcome, because an answer key turns open coding into grading.
-->
<style>
  :root{
    /* Role hues: user blue, assistant slate, tool call amber. Green is not a role: it
       stays reserved for --ok (saved, no-failure, opened policy) so it never reads as a role. */
    --user:#2563eb; --assistant:#475569; --call:#b45309; --result:#7c3aed; --ok:#059669;
    --call-bg:#faf8f5; --call-line:#e7d6b8;
    --gap-step:8px; --gap-turn:36px;
    --ink:#1a1a1a; --muted:#6b7280; --line:#e5e7eb; --bg:#fbfbfa; --warn:#b91c1c;
    /* Layout. The conversation column used to be uncapped, so on a wide screen it
       stretched to the viewport and the rail sat a screen-width from the text --
       which reads as "the rail is too far away" but is really an uncapped column.
       Set data-rail="left" on .cols to move the rail; a flex `order` alone would
       leave border-inline-start drawing on the far screen edge instead of the
       seam facing the text. */
    --body-max:860px; --rail-w:420px; --list-w:320px;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       color:var(--ink);background:var(--bg)}
  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
         padding:6px 16px;display:flex;flex-direction:column;gap:6px}
  /* Row 1: where you are (tabs, progress). Row 2, Review only: which
     conversation, and how it is displayed. */
  header .hrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-height:28px}
  header [hidden]{display:none}   /* beats `header label{display:inline-flex}` below */
  header .right{margin-left:auto;display:flex;gap:12px;align-items:center}
  header button,header label{height:28px;display:inline-flex;align-items:center;gap:4px}
  header .id{font-family:ui-monospace,monospace;font-size:12.5px}
  header .meta{color:var(--muted);font-size:12.5px}
  .tabs{display:flex;gap:4px}
  .tabs button,.nav button{font:inherit;padding:0 10px;border:1px solid var(--line);
       background:#fff;border-radius:6px;cursor:pointer}
  .tabs button.on{border-color:var(--ink);font-weight:600}
  .nav{display:flex;gap:6px;align-items:center}
  .view{display:none} .view.on{display:block}

  .cols{display:flex;align-items:flex-start;gap:0;
        max-width:calc(var(--list-w) + var(--body-max) + var(--rail-w));margin:0 auto}
  .body{flex:1 1 auto;min-width:0;max-width:var(--body-max);padding:16px 20px 240px}
  .rail{order:2;flex:0 0 var(--rail-w);
        position:sticky;top:76px;max-height:calc(100vh - 84px);overflow:auto;
        padding:16px;border-left:1px solid var(--line);background:#fff}
  /* order must be NEGATIVE: .body declares no order, so it is 0, and order:0 on
     the rail is a tie broken by document order -- .body comes first, so the rail
     would not move at all. */
  .cols[data-rail="left"] .rail{order:-1;border-left:0;border-right:1px solid var(--line)}
  /* The conversation list: every pool conversation, filtered with counts. */
  .list{order:-2;flex:0 0 var(--list-w);position:sticky;top:76px;max-height:calc(100vh - 84px);
        overflow:auto;border-right:1px solid var(--line);background:#fff;font-size:12.5px}
  .list .filters{position:sticky;top:0;z-index:1;background:#fff;padding:8px;
                 border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;
                 gap:4px 8px;align-items:center}
  .list .filters label{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
  .list .filters .warn,.list .filters .scope{grid-column:1 / -1}
  .list select{font:inherit;font-size:12px;width:100%;height:26px;padding:0 24px 0 8px;
               border:1px solid var(--line);border-radius:6px;background:#fff;color:inherit;cursor:pointer;
               appearance:none;-webkit-appearance:none;
               background-image:linear-gradient(45deg,transparent 50%,#6b7280 50%),linear-gradient(135deg,#6b7280 50%,transparent 50%);
               background-position:calc(100% - 13px) 11px,calc(100% - 9px) 11px;background-size:4px 4px;background-repeat:no-repeat}
  .list select:hover{border-color:#9ca3af}
  .list select:focus{outline:2px solid #c7d2fe;outline-offset:0;border-color:var(--user)}
  .list .warn{color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:4px 6px;font-weight:600}
  .lrow{display:flex;align-items:center;gap:6px;padding:3px 8px;border-bottom:1px solid var(--line);
        cursor:pointer;white-space:nowrap;line-height:18px}
  .lrow:hover{background:#f9fafb}
  .lrow.cur{background:#eef2ff;box-shadow:inset 3px 0 0 var(--user)}
  .lrow .role{color:#6b7280}
  .lrow .modes{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .tc{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 2px 0 0;vertical-align:middle}
  .tc.u{background:#d1d5db} .tc.p{background:var(--ok)} .tc.f{background:var(--warn)}
  .pill{flex:0 0 auto;margin-left:auto;border:1px solid var(--line);border-radius:10px;padding:0 6px;font-size:11px}
  .pill .x{color:var(--warn);font-weight:700}
  .dia{color:var(--result)}
  .lrow .chip{font-size:10.5px;margin-left:3px}
  .lrow .bt{flex:0 0 auto;margin-left:auto;font-size:10.5px;color:#6b7280}
  .lrow .bt.pool{color:#b45309}

  .turn{margin:0 0 var(--gap-turn)}
  .turn + .turn{border-top:2px solid var(--line);padding-top:16px}
  .turn h3{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
           color:var(--muted)}
  .turn .tid{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--muted)}
  .msg{border-left:3px solid var(--line);padding:6px 10px;margin:var(--gap-step) 0}
  .msg .who{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
            margin-bottom:2px}
  .msg.user{border-left-color:var(--user)} .msg.user .who{color:var(--user)}
  .msg.agent{border-left-color:var(--assistant);font-style:italic}
  .msg.agent .who{color:var(--assistant);font-style:normal}
  .step{border:1px solid var(--call-line);border-radius:8px;margin:var(--gap-step) 0;overflow:hidden;background:#fff}
  .step .fn{font-family:ui-monospace,monospace;font-size:12.5px;font-weight:600;
            padding:6px 10px 0;background:var(--call-bg);color:var(--call)}
  .step pre{margin:0;padding:4px 10px 8px;font-family:ui-monospace,monospace;font-size:11.5px;
            white-space:pre-wrap;word-break:break-word;background:var(--call-bg)}
  /* One tool box in both views: call header on the call tint, structured output, raw JSON. */
  :is(.step, #lab .fq-tool) .tool-output{border-top:1px solid var(--call-line)}
  .step .out{border-top:1px dashed var(--line);color:var(--result)}
  .step details.out summary{cursor:pointer;padding:6px 10px;font-family:ui-monospace,monospace;font-size:11.5px;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Not pinned: a sticky reply hid the steps it summarises and forced a nested
     scroll. It now sits in the turn's flow, in full. */
  .reply{background:#fff;border-left:3px solid var(--assistant);padding:8px 12px;margin-top:var(--gap-step)}
  .reply .who{font-size:11px;font-weight:700;color:var(--assistant);letter-spacing:.05em}
  .reply .txt{white-space:pre-wrap}

  .note{margin:8px 0 0}
  .note textarea{width:100%;min-height:52px;font:inherit;padding:6px 8px;
       border:1px solid var(--line);border-radius:6px;resize:vertical}
  .note .row{display:flex;gap:6px;align-items:center;margin-top:4px}
  .note .row button{font:inherit;padding:3px 9px;border:1px solid var(--line);
       background:#fff;border-radius:6px;cursor:pointer}
  .saved{font-size:12px;color:var(--ok)}
  .saved.fail{color:var(--warn)}
  .verdict{font-size:10.5px;font-weight:700;letter-spacing:.05em;margin-right:4px}
  .saved button{font:inherit;font-size:11px;margin-left:6px;padding:0 5px;
      border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;
      color:var(--muted)}
  .saved button:hover{color:var(--ink)}
  .saved .wd input{font:inherit;font-size:11.5px;padding:0 5px;margin-left:6px;width:220px;
      border:1px solid var(--line);border-radius:4px}
  .saved .wd[hidden]{display:none}
  .withdrawn{font-size:12px;color:var(--muted)}
  .anchor{font-size:11.5px;color:var(--muted);font-family:ui-monospace,monospace}
  /* One required verdict per turn; step notes take no space until opened. */
  .verdictbox{border:2px solid var(--ink);border-radius:8px;padding:8px 10px;margin-top:10px;background:#fff}
  .verdictbox .vh{font-size:11px;font-weight:700;letter-spacing:.06em}
  .badge{font-size:11px;font-weight:700;letter-spacing:.05em;margin-left:8px}
  .badge.missing{color:var(--warn)} .badge.ok{color:var(--ok)}
  .addnote{float:right;border:0;background:none;font:inherit;font-size:11px;color:var(--muted);
           opacity:.35;cursor:pointer;padding:0 2px}
  .msg:hover .addnote,.step:hover .addnote,.addnote:focus{opacity:1;color:var(--ink)}
  .stepnote .add[hidden]{display:none}
  .stepref{font-size:12px;color:var(--warn)}
  /* The verdict (derived, exclusive), its reasons (entered), then the AI's
     suggested reason (decided separately). */
  .verdictbox .vh b{letter-spacing:.04em}
  .verdictbox .vh .v-failure,.verdictbox .vh .v-missing,.verdictbox .vh .v-conflict{color:var(--warn)}
  .verdictbox .vh .v-nofailure{color:var(--ok)}
  .verdictbox .lbl{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--muted);margin-top:6px}
  .vsec{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line)}
  .vsec.ai .lbl{color:var(--result)}
  .linkbtn{border:0;background:none;font:inherit;font-size:12px;color:var(--muted);cursor:pointer;padding:0}
  .linkbtn:hover{color:var(--ink)}

  /* .ev-rail: the same evidence cards inside the Labels card (railHtml). */
  :is(.rail, .ev-rail) h4{margin:0 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
           color:var(--muted)}
  :is(.rail, .ev-rail) .card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 10px}
  :is(.rail, .ev-rail) table{width:100%;border-collapse:collapse;font-size:12px}
  /* `anywhere`, not `break-word`: only `anywhere` lowers a cell's min-content
     width, so an unbreakable value (a JSON record) wraps instead of widening
     the table past the rail and pushing every value out of view. */
  :is(.rail, .ev-rail) td{padding:1px 0;vertical-align:top;overflow-wrap:anywhere}
  :is(.rail, .ev-rail) td.k{color:var(--muted);padding-right:8px;white-space:nowrap}
  .flag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--warn);
        border:1px solid var(--warn);border-radius:4px;padding:0 4px;margin:2px 3px 0 0}
  :is(.rail, .ev-rail) .gap{color:var(--warn);font-weight:700}
  :is(.rail, .ev-rail) code{font-family:ui-monospace,monospace;font-size:11.5px}
  .ev-rail{margin-top:6px}
  ul.plain{margin:2px 0 0;padding-left:16px}
  .progress td{padding:2px 12px 2px 0}
  .empty{color:var(--muted);padding:16px 20px}
  /* AI suggestions: dashed and tinted so they never read as the reviewer's own
     notes (hw4.md Part A: "displayed separately from human annotations"). */
  .sugg{border:1.5px dashed var(--result);border-radius:8px;padding:8px 10px;margin:8px 0;
        background:#faf5ff;font-size:13px}
  .sugg .lbl{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--result)}
  .sugg.done{opacity:.75;padding:4px 10px}
  .sugg .chg{font-size:11px;margin-left:6px;padding:0 5px}
  .sugg textarea{width:100%;min-height:40px;font:inherit;padding:4px 6px;margin:4px 0;
      border:1px solid var(--line);border-radius:6px;resize:vertical}
  .sugg .def{color:var(--muted);margin:2px 0}
  .sugg .prov{font-size:11px;color:var(--muted);margin-top:2px}
  .prov details{display:inline;margin-left:6px}.prov summary{cursor:pointer;display:inline}
  .slist td{padding:4px 10px 4px 0;vertical-align:top;font-size:13px}
  .slist tr.row{cursor:pointer}
  #tax .card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 10px;background:#fff}
  .moderow{font-size:11.5px;margin:2px 0 4px 12px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .moderow .lbl{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
  .chip{border:1px solid var(--result);color:var(--result);border-radius:10px;padding:0 6px}
  .chip button,.xbtn{border:0;background:none;cursor:pointer;color:inherit;font:inherit;padding:0 2px}
  .addmode-btn{font:inherit;font-size:11.5px;padding:0 7px;border:1px solid var(--line);
               background:#fff;border-radius:10px;cursor:pointer;color:var(--muted)}
  .addmode-btn:hover{color:var(--ink)}
  .modepick{margin:2px 0 8px 12px;max-width:calc(100% - 12px);border:1px solid var(--line);
            border-radius:8px;background:#fff;padding:8px}
  .modepick .ph{display:flex;align-items:center;font-size:12px;font-weight:600;margin-bottom:6px}
  .modepick .ph button{margin-left:auto;border:0;background:none;font:inherit;font-size:12px;
                       font-weight:400;color:var(--muted);cursor:pointer}
  .modecard{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:#fff;
            border:1px solid var(--line);border-radius:6px;padding:6px 9px;margin:0 0 6px;cursor:pointer}
  .modecard:hover,.modecard:focus{background:#f5f3ff}
  .modecard .nm{font-size:13.5px} .modecard .nm b{font-weight:700}
  .modecard .df{font-size:12.5px;color:var(--muted)}
  .modecard .ex{font-size:12px;color:#9ca3af;margin-top:2px}
  .flash{font-size:12px;color:var(--ok)}
  /* The failure note jumped to by opening a conversation under Status "failing", or pressing g. */
  @keyframes hl{from{outline-color:var(--warn)}to{outline-color:transparent}}
  .saved.hl{outline:2px solid transparent;outline-offset:2px;border-radius:4px;animation:hl 1.5s ease-out}
  #tax h4{margin:16px 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  #lab .labhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  /* Labels is one screen: no page scroll (no bottom padding), each column scrolls inside .fq, whose
     height fitLab() measures from where it starts, so a wrapping header can never cut a column off.
     1800px keeps reply lines readable on a wide screen. */
  #lab.body{max-width:1800px;padding-bottom:0}
  /* List: as wide as its rows. Card: the decision column holds the most material, so it gets ~30%. */
  #lab .fq{display:grid;grid-template-columns:fit-content(var(--list-w)) minmax(0,1fr) clamp(340px,30%,560px);gap:12px;
           align-items:stretch;height:70vh}
  #lab .fq > *{min-height:0}
  #lab .fq-tool.pol{border-left:3px solid var(--ok)}
  #lab .fq-list .lrow.done{color:#6b7280}
  /* Row marks: F (red) / N (grey) match the keys; ◆ = your live label differs from the AI; • = unsaved draft. */
  #lab .lrow .mk{font:600 11px ui-monospace,Menlo,monospace;color:#6b7280;min-width:1ch}
  #lab .lrow .mk.f{color:var(--warn)}
  #lab .lrow .dia2{color:var(--result);font-size:10.5px;min-width:1ch}
  #lab .lrow .dot{color:var(--user);font-weight:700;min-width:1ch}
  /* Header: queue chips, progress toward 30 / 30 by conversation. */
  #lab .chips{display:inline-flex;gap:4px}
  #lab .progs{display:inline-flex;gap:10px;align-items:center;font-size:12.5px}
  #lab .prog{display:inline-flex;gap:4px;align-items:center}
  #lab .prog .bar{display:inline-block;width:48px;height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden}
  #lab .prog .bar span{display:block;height:100%;background:#6b7280}
  #lab .prog.f .bar span{background:var(--warn)}
  /* Card steps: 1 Decide (the only form), 2 Compare (yours next to the AI's). */
  #lab .steps{display:flex;gap:6px;font-size:12px;color:#9ca3af}
  #lab .steps .on{color:var(--ink);font-weight:600}
  #lab .cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #lab .pane{border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:grid;gap:4px;align-content:start}
  #lab .pane .lbl{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
  #lab .pane b.f{color:var(--warn)}
  #lab .pane .just{white-space:pre-wrap;word-break:break-word;font-size:12.5px;color:#374151}
  #lab .tag{font-weight:600}
  #lab .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:3px}
  #lab .sw.you{background:#ddd6fe} #lab .sw.ai{background:#fde68a}
  #lab details.mini{padding:3px 6px;font-size:11.5px;color:#4b5563}
  #lab .cited{display:grid;gap:3px}
  #lab .fq-card .labhead{flex-wrap:wrap}
  #lab .need{color:#b45309;font-size:12px;min-height:0}
  #lab .pairhead{font:600 13px ui-monospace,Menlo,monospace;color:#374151}
  #lab .sameturn{background:#fef3c7;color:#92400e;border-radius:4px;padding:4px 6px;font-size:12px}
  @media (prefers-reduced-motion:no-preference){
    @keyframes qflash{from{background:#fde68a}to{background:transparent}}
    #lab .q.flash{animation:qflash 1.2s ease-out;border-radius:4px}
  }
  #lab .hist{display:grid;gap:2px;font-size:12px;color:#4b5563}
  #lab .need:empty{display:none}
  /* Verdict is a setting (a two-part switch), not a command; the bar below holds the only actions. */
  #lab .seg-row{display:flex;gap:8px;align-items:center}
  #lab .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
  #lab .seg button{border:0;border-radius:0;background:transparent;padding:4px 12px;font:inherit;cursor:pointer;color:var(--ink)}
  #lab .seg button + button{border-left:1px solid var(--line)}
  #lab .seg button.on{background:var(--user);color:#fff}
  #lab .actbar{display:flex;gap:12px;align-items:center;justify-content:flex-end;border-top:1px solid var(--line);padding-top:8px;flex-wrap:wrap}
  #lab .actbar .status{margin-right:auto;color:#b45309;font-size:12px}
  #lab .actbar button.link{border:0;background:none;color:var(--user);text-decoration:underline;cursor:pointer;padding:0;font:inherit}
  #lab .actbar button.save{background:var(--user);color:#fff;border:1px solid var(--user);border-radius:6px;padding:4px 14px;cursor:pointer}
  #lab .actbar button.save[disabled]{opacity:.45;cursor:default}
  #lab .fq-card .q{font-size:15px}
  #lab details.fq-tool summary{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Grid items default to min-width:auto, so a one-line summary would widen the whole
     conversation column; let them shrink so the summary ellipsis applies instead. */
  #lab .fq-conv, #lab .fq-turn, #lab details.fq-tool{min-width:0}
  #lab .pid-ok{background:#ecfdf5;color:var(--ok);padding:0 2px;border-radius:3px}
  #lab .pid-no{background:#fef2f2;color:var(--warn);padding:0 2px;border-radius:3px;font-weight:600}
  #lab .labhead button.on{background:var(--user);color:#fff;border-color:var(--user)}
  /* Rows are Review's .lrow; the pane is styled like Review's list. */
  #lab .fq-list{overflow:auto;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:6px}
  #lab .fq-conv{overflow:auto;align-content:start;display:grid;gap:var(--gap-turn);font-size:14px}
  /* Labels turns use Review's turn markup (turnHtml), boxed: the pane's gap separates them, not .turn's margin. */
  #lab .fq-turn{border:1px solid var(--line);border-radius:6px;padding:8px;margin:0}
  #lab .fq-turn.target{border:2px solid var(--warn)}
  #lab .step.pol{border-left:3px solid var(--ok)}
  #lab .fq-tool{background:#f3f4f6;font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;padding:6px;border-radius:4px}
  #lab mark{background:#fde68a;padding:0 1px}
  /* The card in three bands: the question stays at the top, your answer at the bottom, and the
     reference material (evidence, boundary) scrolls between them. */
  #lab .fq-card{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;border:1px solid #e5e7eb;border-radius:6px;
                padding:10px;font-size:13px;overflow:hidden}
  #lab .fq-top, #lab .fq-bot{display:grid;gap:8px;align-content:start}
  #lab .fq-ref{display:grid;gap:8px;align-content:start;overflow:auto;border-top:1px solid #f3f4f6;border-bottom:1px solid #f3f4f6;padding:6px 0}
  #lab .fq-bot{max-height:55vh;overflow:auto}   /* a long comparison scrolls instead of squeezing the reference band away */
  #lab .fq-edit{display:grid;gap:8px}
  #lab .fq-card textarea{width:100%;min-height:70px;font:13px/1.4 system-ui,sans-serif}
  /* Source lookup: neutral colours only, so neither the panel nor a text hit reads as a verdict. */
  #lab .fq-reply :is(.pid-ok, .pid-no){cursor:pointer}
  /* Floating over the conversation, in its content coordinates, so it never moves the reader's scroll. */
  #lab .fq-conv{position:relative}
  #lab .src-box{position:absolute;z-index:5;overflow:auto;background:#fff;border:1px solid #d1d5db;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:6px 8px;font-size:13px;display:grid;gap:6px;align-content:start}
  #lab .src-head{display:flex;justify-content:space-between;align-items:start;gap:8px;position:sticky;top:-6px;background:#fff}

  ::highlight(src){background:#bae6fd}

  ::highlight(ev){background:#ddd6fe}
  #lab .src-quote, #lab .src-cite{font-size:11.5px;padding:0 6px;cursor:pointer}
  #lab .src-cite{float:right;margin-left:6px}
  :is(#lab, #keys) kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid currentColor;border-radius:3px;padding:0 3px;margin-left:4px}
  /* The key list (?): one element, filled for the open tab. */
  #keys{position:fixed;right:16px;bottom:16px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:8px;
        box-shadow:0 4px 16px rgba(0,0,0,.12);padding:8px 12px;font-size:12.5px}
  #keys td{padding:1px 10px 1px 0;vertical-align:top}

  /* Tool evidence: readable values first; the original payload remains inspectable. */
  .tool-output{padding:10px 12px;color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;white-space:normal;overflow-wrap:anywhere}
  .tool-fields{display:grid;grid-template-columns:minmax(90px,145px) minmax(0,1fr);gap:5px 14px;margin:0}

  .tool-fields dd.tool-wide{margin:0 0 8px}
  .tool-value{white-space:pre-wrap}

  .tool-items{margin:0;padding-left:22px}
  .tool-items>li{padding:8px 0;border-bottom:1px solid var(--line)}

  .tool-policy{max-width:75ch;white-space:pre-wrap}

  .tool-source-note{color:var(--muted);font-size:12px;margin:0 0 8px}
  details.tool-raw{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.45 ui-monospace,Menlo,monospace;padding:8px 12px;background:#f8fafc;border-top:1px solid var(--line)}
  details.tool-raw>summary{white-space:normal;cursor:pointer;color:var(--muted);font:12px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #lab .fq-tool{padding:0;background:#fff;white-space:normal;border:1px solid var(--call-line);border-radius:8px;overflow:hidden}
  #lab .fq-tool .tool-call{padding:8px 12px;background:var(--call-bg);white-space:pre-wrap;overflow-wrap:anywhere}
  #lab .fq-tool .tool-call>b{color:var(--call)}
  #lab details.fq-tool.mini>summary.tool-call{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 10px;font:12px/1.4 ui-monospace,Menlo,monospace}
  /* Judge tab (HW5 Part C): the sample and both rates with their 95% CIs first, then each disagreement.
     Pass is a green outline, Fail a red fill: the word, the hue and the fill each tell them apart. */
  #judge .body{max-width:1320px;margin-inline:auto}
  #jv{font-variant-numeric:tabular-nums}

  #jv .band>.cell{padding:0 28px;border-left:1px solid var(--line)}

  #jv .cell .pt{font-size:12.5px;color:var(--muted);margin-top:2px}
  #jv .cell .pt .tag{margin-right:2px}
  #jv .cm{border-collapse:collapse}
  #jv .cm th,#jv .cm td{padding:4px 10px;border:1px solid var(--line);text-align:center;font-weight:400}
  #jv .cm th{color:var(--muted);font-size:12.5px;background:#fff}
  #jv .cm td b{display:block;font-size:16px}

  #jv .count{margin:28px 0 2px;font-size:16px;font-weight:600}

  #jv table.dis th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--ink);white-space:nowrap}
  #jv table.dis td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  #jv table.dis tr.off td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
  #jv td.txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.5}
  #jv td.txt details{margin-top:4px}
  #jv td.txt summary{cursor:pointer;color:var(--muted);font-size:12px}
  #jv .turn{display:block;color:var(--muted);font-size:12px}
  #jv .tag{display:inline-block;padding:0 8px;border-radius:9px;font-size:12px;line-height:18px;border:1px solid var(--ink);color:var(--ink);background:#fff}
  #jv .tag.pass{border-color:var(--ok);background:#ecfdf5;background:color-mix(in srgb,var(--ok) 12%,#fff)}
  #jv .tag.fail{border-color:var(--warn);background:var(--warn);color:#fff}
  #jv .jv-edit{display:block;margin-top:6px;font-size:12px}
  #jv .chg{display:block;margin-top:4px;color:var(--warn);font-size:12px}
  #jv tr.seen .jv-open::after{content:" (opened)";color:var(--muted);font-size:12px}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (max-width:1100px){ #jv .band>.cmw{flex-basis:100%;padding-left:0;border-left:0} }
  @media (max-width:720px){
    .tabs{flex-wrap:wrap}   /* six tabs overflow a phone; every tab, Judge included, stays reachable */
    #judge .body{padding:12px 16px 120px}

    #jv .band>.cell{padding:0;border-left:0}

    #jv .sample .big,#jv .sample .pt{display:inline-block;vertical-align:baseline;margin-right:10px}
    #jv .band>.rate{flex:1 1 40%}

    #jv table.dis td.txt{flex-basis:100%}

    #jv table.dis tr.off{box-shadow:inset 3px 0 0 var(--ink)}
