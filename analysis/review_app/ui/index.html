</style>

<header>
  <div class="hrow">
    <span class="tabs">
      <button data-tab="review" class="on">Review</button>
      <button data-tab="suggestions">Suggestions</button>
      <button data-tab="taxonomy">Taxonomy</button>
      <button data-tab="labels">Labels</button>
      <button data-tab="progress">Progress</button>
      <button data-tab="judge">Judge</button>
    </span>
    <span class="right"><span class="meta" id="h-prog"></span></span>
  </div>
  <div class="hrow" id="hrow-review">
    <span class="nav">
      <button id="prev">←</button><span class="meta" id="pos"></span><button id="next">→</button>
    </span>
    <span class="id" id="h-id">loading…</span>
    <span class="meta" id="h-meta"></span>
    <span class="right">
      <span class="meta">View:</span>
      <label class="meta" title="show the AI's depth-search suggestions under each turn">
        <input type="checkbox" id="show-sugg"> AI hints</label>
      <label class="meta" title="assign each failure note to a failure mode, under the note">
        <input type="checkbox" id="show-axial"> Axial coding</label>
    </span>
  </div>
</header>

<div id="review" class="view on">
  <div class="cols" data-rail="right">
    <div class="list" id="list"></div>
    <div class="body" id="conv"></div>
    <div class="rail" id="rail"></div>
  </div>
</div>
<div id="suggestions" class="view"><div class="body" id="sugg"></div></div>
<div id="taxonomy" class="view"><div class="body" id="tax"></div></div>
<div id="labels" class="view"><div class="body" id="lab"></div></div>
<div id="progress" class="view"><div class="body"><table class="progress" id="prog"></table></div></div>
<div id="judge" class="view"><div class="body" id="jv"></div><p id="jv-live" class="sr-only" aria-live="polite"></p></div>
<div id="keys" hidden></div>

<script>
const S = {index:[], cur:0, view:null, annotations:[], superseded:{}, withdrawn:[], suggestions:[], modes:[],
           showSugg:true, expanded:new Set(), showAxial:false,
           failAt:-1,   // failAt: index of the last failure note jumped to
           f:{batch:'sample', status:'all', mode:''},   // the list's filters
           held:[],   // the list's captured membership, in scenario order (see capture)
           hashSeen:'',   // the hash last applied or written, so our own writes are not re-applied
           manifest:{manifest_ok:true, reason:null},   // GET /api/manifest; false means the sample reads empty
           tax:{modes:[], unassigned:[], gone:[]}, flash:null,
           pickerFor:null,   // annotation id whose "add to a mode" panel is open
           aiOpen:new Set()};   // trace ids whose collapsed pending AI suggestion was opened

/* A per-viewer display preference only; the page works without storage. */
try { S.showSugg = localStorage.getItem('showSugg') !== '0'; } catch (e) {}
try { S.showAxial = localStorage.getItem('showAxial') === '1'; } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Raw tool payloads start collapsed. Both tabs re-render on every action, so the payloads the
   reviewer opened are remembered by key (trace id + step index) and reopened. */
const openOut = new Set();
document.addEventListener('toggle', e => {
  const k = e.target.dataset && e.target.dataset.out;
  if (k) e.target.open ? openOut.add(k) : openOut.delete(k);
}, true);   // 'toggle' does not bubble: listen in the capture phase
const outAttrs = k => `data-out="${esc(k)}"${openOut.has(k) ? ' open' : ''}`;
/* Render only recorded values: ok=true is not a claim that an action executed. */
function toolValue(value, field = ''){
  if (value === undefined) return '<span class="tool-empty">missing</span>';
  if (value === null) return '<span class="tool-empty">null</span>';
  if (Array.isArray(value)) return value.length
    ? `<ol class="tool-items">${value.map(v => `<li>${toolValue(v)}</li>`).join('')}</ol>`
    : '<span class="tool-empty">[] (empty list)</span>';
  if (typeof value === 'object'){
    const entries = Object.entries(value);
    if (!entries.length) return '<span class="tool-empty">{} (empty object)</span>';
    return `<dl class="tool-fields">${entries.map(([key, v]) => {
      const wide = v !== null && typeof v === 'object' || key === 'body' || key === 'snippet';
      const cls = wide ? ' class="tool-wide"' : '';
      return `<dt${cls}>${esc(key.replace(/_/g, ' '))}</dt><dd${cls}>${toolValue(v, key)}</dd>`;
    }).join('')}</dl>`;
  }
  if (value === '') return '<span class="tool-empty">"" (empty string)</span>';
  if (typeof value === 'string' && (field === 'body' || field === 'snippet')){
    // Escape before adding a small amount of structure; no HTML or link execution.
    return `<div class="tool-policy">${value.split(/\n\s*\n/).map(block => {
      const heading = block.match(/^#{1,6} (.+)$/);
      return heading ? `<h4>${esc(heading[1])}</h4>` : `<p>${esc(block)}</p>`;
    }).join('')}</div>`;
  }
  return `<span class="tool-value">${esc(String(value))}</span>`;
}
/* Short inputs stay on the call line; a long one (an escalation's context) renders as readable fields. */
const toolArgs = s => s.in === undefined ? 'missing input' : JSON.stringify(s.in);
const longInput = s => toolArgs(s).length > 100;
const toolInput = s => `<div class="tool-output"><p class="tool-source-note">Input</p>${toolValue(s.in)}</div>`;
function toolOutput(s, key){
  const raw = JSON.stringify(s.out, null, 1);
  const note = s.tool === 'search_help_center' ? '<p class="tool-source-note">Search snippets only · these are not opened policy documents.</p>' : '';
  // Keep the direct JSON text node last: Labels source lookup searches it and opens this disclosure.
  return `<div class="tool-output">${note}${toolValue(s.out)}</div>`
    + `<details class="tool-raw" ${outAttrs(key)}><summary>Raw JSON output</summary>${esc(raw === undefined ? 'missing (no output recorded)' : raw)}</details>`;
}
const j = async (u,o) => (await fetch(u,o)).json();
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

async function boot(){
  S.index = await j('/api/index');
  S.manifest = await j('/api/manifest');
  S.annotations = await j('/api/annotations');
  S.superseded = (await j('/api/history')).superseded_counts;
  S.withdrawn = await j('/api/withdrawn');
  S.suggestions = await j('/api/suggestions');
  S.modes = (await j('/api/patterns')).modes || [];
  await renderTaxonomy();   // the mode and "needs a decision" filters read it
  const lab = applyHash();
  await show();
  if (lab) setTab('labels');   // a Labels hash reopens the Labels tab at its pair
}

function unsavedNotes(){
  return [...document.querySelectorAll('#conv textarea')].filter(x => x.value.trim()).length;
}

/* Leaving a conversation re-renders #conv, so anything typed and not saved is
   gone. Ask once rather than losing a reviewer's only copy of an observation. */
function mayLeave(){
  const n = unsavedNotes();
  return !n || confirm(`${n} unsaved note(s) on this page will be discarded. Continue?`);
}

/* The tabs, the progress header and the list's filters load whether or not a
   conversation is open; only the conversation's own rendering needs a row. */
async function show(){
  // A later show() supersedes this one: each await below checks the generation
  // and drops a stale completion (fast back/forward could otherwise render a
  // conversation the user already left, or read S.view after it was cleared).
  const gen = S.showGen = (S.showGen || 0) + 1;
  const row = S.index[S.cur];
  if (row){
    const view = await j('/api/session/' + row.session_id);
    if (gen !== S.showGen) return;
    S.view = view;
    const t = S.view.totals;
    $('#h-id').textContent = S.view.scenario_id + '  ·  ' + S.view.session_id.slice(0,8);
    $('#h-meta').textContent = `${roleLabel()} · ${plural(t.turns, 'turn')} · `
      + `${plural(t.tool_calls, 'tool call')} · ${t.latency_s}s`;
    $('#h-meta').title = `user u${S.view.user_id} · session ${S.view.session_id.slice(0,8)} · `
      + `${plural(t.distinct_tools, 'distinct tool')} · prompt ${S.view.prompt_version || '?'}`;
  }
  S.flash = null; S.pickerFor = null; S.aiOpen = new Set();
  await renderTaxonomy();   // modes feed the MODE rows and the list; never throws
  if (gen !== S.showGen) return;
  renderProgress(); renderSuggestions();
  if (!row){
    S.view = null;
    $('#h-id').textContent = 'no conversation open';
    $('#h-meta').textContent = '';
    $('#conv').innerHTML = '<p class="empty">no conversation open: none matches the filters</p>';
    $('#rail').innerHTML = '';
    return;
  }
  renderConversation(); renderRail();
  S.failAt = -1;
  if (S.f.status === 'failing') nextFailure();   // on open only, not on every re-render
  const el = document.querySelector('#list .lrow.cur');
  if (el) el.scrollIntoView({block: 'nearest'});
}

/* Scroll to the next live failure note in document order (verdict box or step
   note), cycling, and flash it. Live notes render as .saved; failures add .fail. */
function nextFailure(){
  const els = [...document.querySelectorAll('#conv .saved.fail')];
  if (!els.length) return;
  S.failAt = (S.failAt + 1) % els.length;
  const el = els[S.failAt];
  el.scrollIntoView({block: 'center'});
  el.classList.remove('hl'); void el.offsetWidth; el.classList.add('hl');   // restart the animation
  setTimeout(() => el.classList.remove('hl'), 1600);
}

/* Re-rendering #conv replaces every textarea, so anything typed and not saved
   would vanish. Snapshot by (trace,turn,step) and restore after. This is what
   lets every save path re-render, which in turn is what gives a just-saved note
   its edit and retract buttons. */
function snapshotDrafts(){
  const d = {};
  for (const box of document.querySelectorAll('#conv .note')){
    const ta = box.querySelector('textarea');
    const key = `${box.dataset.trace}|${box.dataset.turn}|${box.dataset.step}`;
    if (ta && ta.value.trim()){
      d[key] = ta.value;
      // an edit in progress must survive a re-render, or saving adds a second note
      if (box.dataset.supersedes) d[key + '|supersedes'] = box.dataset.supersedes;
    }
  }
  for (const ta of document.querySelectorAll('#conv .sugg[data-sid] textarea')){
    const card = ta.closest('.sugg');
    if (ta.value.trim()) d['sg|' + card.dataset.sid] = [card.dataset.form, ta.value];
  }
  return d;
}

function restoreDrafts(drafts){
  for (const box of document.querySelectorAll('#conv .note')){
    const key = `${box.dataset.trace}|${box.dataset.turn}|${box.dataset.step}`;
    if (drafts[key]){
      box.querySelector('textarea').value = drafts[key];
      const add = box.querySelector('.add');
      if (add) add.hidden = false;          // a draft in a step note stays open
      const sup = drafts[key + '|supersedes'];
      if (sup && S.annotations.some(a => a.id === sup)){   // only while that note is still live
        box.dataset.supersedes = sup;
        const err = box.querySelector('.msg-err');
        if (err) err.textContent = 'editing — saving replaces that note (the original stays in history)';
      }
      const more = box.querySelector('.addmore');
      if (more) more.hidden = true;
    }
  }
  for (const card of document.querySelectorAll('#conv .sugg[data-sid]:not(.done)')){
    const v = drafts['sg|' + card.dataset.sid];
    if (v) openAiForm(card, v[0], v[1]);
  }
}

function renderConversation(drafts){
  const out = [];
  if (S.view.turns.length > 1)
    out.push(`<p class="meta">Each turn is a separate trace: give each turn its own verdict.</p>`);
  for (const turn of S.view.turns) out.push(turnHtml(turn, {notes: true, role: roleLabel()}));
  $('#conv').innerHTML = out.join('');
  wireNotes(); wireSuggestions(); wireModes();
  if (drafts) restoreDrafts(drafts);
}

/* One turn's markup, shared by Review and the Labels focus view.
   Review: o.notes adds the note buttons, step note boxes and the verdict box (with AI cards).
   Labels: o.lab (fq-* classes), o.cls / o.id on the turn, o.tag after the header, o.key (raw-output key
   prefix), o.fold (an earlier turn: tool calls fold to one line, interim text omitted), o.prose (interim
   text format) and o.reply (the reply's HTML). Labels source lookup depends on this shape: the turn is
   .fq-turn, .fq-user's last child is the user text node, a details[data-out]'s last child is the raw JSON
   text node, and .fq-reply is the reply text element. */
function turnHtml(turn, o){
  const add = step => o.notes ? addNote(step) : '', note = step => o.notes ? noteBox(turn, step) : '';
  const out = [`<section class="turn${o.cls ? ' ' + o.cls : ''}"${o.id ? ` id="${o.id}"` : ''}>`,
    `<h3>Turn ${turn.turn} <span class="tid">trace ${esc(turn.trace_id)} · ${turn.latency_s}s</span>${o.notes ? verdictBadge(turn) : o.tag || ''}</h3>`,
    `<div class="msg user${o.lab ? ' fq-user' : ''}"><div class="who">User · ${esc(o.role)}${add('user')}</div>${esc(turn.user)}</div>`,
    note('user')];
  for (const [i, s] of turn.steps.entries()){
    const step = stepAnchor(s, i), key = `${o.key || ''}${turn.trace_id}#${i}`;
    if (o.fold){ if (s.kind === 'tool') out.push(toolStep(s, key)); continue; }
    if (s.kind === 'agent')
      out.push(`<div class="msg agent"><div class="who">Assistant · interim${add(step)}</div>${(o.prose || esc)(s.text)}</div>`);
    else
      out.push(`<div class="step${o.lab && s.tool === 'get_policy' ? ' pol' : ''}"><div class="fn"><span class="meta">Tool call ·</span> ${esc(s.tool)}()${add(step)}</div>`
        + (longInput(s) ? toolInput(s) : `<pre>in  ${esc(JSON.stringify(s.in, null, 1))}</pre>`) + toolOutput(s, key) + '</div>');
    out.push(note(step));
  }
  out.push(`<div class="reply"><div class="who">Assistant · final reply</div><div class="txt${o.lab ? ' fq-reply' : ''}">${o.reply ?? esc(turn.reply)}</div>`,
           note('reply'), `</div></section>`);
  return out.join('');
}

/* A note anchors to (trace_id, turn, step) -- structural, not character offsets,
   which break whenever rendering changes. */
function stepAnchor(s, i){ return s.kind === 'tool' ? `tool:${s.tool}#${i}` : `agent#${i}`; }

function existing(trace_id, step){
  return S.annotations.filter(a => a.trace_id === trace_id && a.step === step);
}

/* Standard chat roles (user / assistant / tool) plus the Cartwheel role, which
   decides what the agent may do (AUTH-1). "support staff", so a support USER is
   never read as the support agent. */
const roleName = role => ({support: 'support staff'}[role] || role || 'unknown role');
const roleLabel = () => roleName(S.view.user_role);

/* The turn's verdict: any live note on its trace. A failure marked at a step
   counts -- the same rule the Progress count uses (server.py index_rows). */
function verdictBadge(turn){
  const live = S.annotations.filter(a => a.trace_id === turn.trace_id), v = verdictOf(live);
  const fail = live.find(a => !a.no_failure);
  const at = v === 'failure' && fail.step !== 'reply' ? ' (at ' + esc(fail.step) + ')' : '';
  return `<span class="badge ${v === 'nofailure' || v === 'failure' ? 'ok' : 'missing'}">${
    v === 'missing' || v === 'conflict' ? '●' : '✓'} ${VERDICT[v]}${at}</span>`;
}

/* The turn's verdict, derived from its live notes and exclusive: any failure
   note is "failure observed"; a no-failure note beside one is a CONFLICT. */
const VERDICT = {failure: 'FAILURE OBSERVED', nofailure: 'NO FAILURE OBSERVED',
                 missing: 'VERDICT MISSING', conflict: 'CONFLICT'};
function verdictOf(live){
  const fail = live.some(a => !a.no_failure), pass = live.some(a => a.no_failure);
  return fail && pass ? 'conflict' : fail ? 'failure' : pass ? 'nofailure' : 'missing';
}

const addNote = step => `<button class="addnote" data-step="${esc(step)}" title="mark a failure at this step">+ note</button>`;

const NOTE_BUTTONS = `
    <button class="edit" title="replace this note">edit</button>
    <button class="retract" title="withdraw this note">retract</button><span class="wd" hidden><input class="wd-reason"
      placeholder="reason (optional)"> <button class="wd-go">Withdraw</button> <button class="wd-cancel">Cancel</button></span>`;

function noteBox(turn, step){
  const verdict = step === 'reply';
  const mine = existing(turn.trace_id, step);
  /* Edit and retract both APPEND -- hw4.md line 106 requires the original open
     code to stay in the saved history, so nothing is rewritten or removed. */
  /* The verdict is shown, not implied: a failure and a no-failure note with
     text looked identical, so a misfiled verdict was invisible. */
  const saved = mine.map(a => `<div class="saved${a.no_failure ? '' : ' fail'}" data-id="${esc(a.id)}"><span class="verdict">${
    a.no_failure ? 'NO FAILURE OBSERVED' : 'FAILURE'}</span>${esc(a.note || '')}${NOTE_BUTTONS}</div>${a.no_failure ? '' : modeRow(a)}`).join('');
  /* A withdrawn note stays on screen, struck through, with the reason given --
     so a reclassified failure is visible without editing it into "no failure". */
  const gone = S.withdrawn.filter(w => w.trace_id === turn.trace_id && w.step === step
      && (w.turn == null || Number(w.turn) === turn.turn))
    .map(w => `<div class="withdrawn" title="${esc((w.note || '') + (w.ts ? ' · withdrawn ' + w.ts.slice(0, 10) : ''))}">withdrawn${
      w.reason ? ': ' + esc(w.reason) : ''} <s>${esc(cutWords(w.note || '', 160))}</s></div>`).join('');
  const dead = S.superseded[`${turn.trace_id}|${step}`] || 0;
  const histline = dead
    ? `<div class="anchor">${plural(dead, 'earlier version')} kept in the history</div>` : '';
  const attrs = `data-trace="${esc(turn.trace_id)}" data-turn="${turn.turn}" data-step="${esc(step)}"`;
  const err = '<div class="msg-err" style="color:var(--warn);font-size:12px"></div>';
  if (verdict) return verdictBox(turn, attrs, gone + histline, err);
  /* A step note marks WHERE the first failure happened; "no failure" is a
     whole-turn verdict and lives in the verdict box. Empty until opened. */
  return `<div class="note stepnote" ${attrs}>${saved}${gone}${histline}
    <div class="add" hidden><textarea placeholder="the failure at this step, in your own words"></textarea>
      <div class="row"><button class="save">Failure here</button> <button class="cancel">cancel</button>
        <span class="anchor">${esc(step)}</span></div>${err}</div></div>`;
}

/* TURN n VERDICT: the verdict is derived and exclusive; REASONS are every live
   failure note on the turn (any step, yours and accepted suggestions'),
   numbered; the AI's suggested reason is decided on its own buttons, which
   never write the reviewer's verdict. */
function verdictBox(turn, attrs, history, err){
  const live = S.annotations.filter(a => a.trace_id === turn.trace_id), v = verdictOf(live);
  const reasons = live.filter(a => !a.no_failure);
  const rows = reasons.map((a, k) => reasonRow(a, `${k + 1}.`)).join('')
    + live.filter(a => a.no_failure).map(a => reasonRow(a, v === 'conflict' ? 'no failure observed:' : 'why it passes:')).join('');
  const open = v === 'missing';   // no verdict yet: the form is open
  return `<div class="note verdictbox" ${attrs}>
    <div class="vh">TURN ${turn.turn} &nbsp;VERDICT: <b class="v-${v}">${VERDICT[v]}</b></div>
    ${v === 'conflict' ? '<div class="stepref">a failure reason and a no-failure note are both live; retract one</div>' : ''}
    ${rows ? `<div class="lbl">${v === 'nofailure' ? 'REASON' : 'REASONS'}</div>${rows}` : ''}${history}
    ${open ? '' : '<button class="addmore linkbtn">+ add reason</button>'}
    <div class="add"${open ? '' : ' hidden'}><textarea placeholder="${esc(REASON_HINT[v])}"></textarea>
      <div class="row">${verdictButtons(v)}${open ? '' : ' <button class="cancel">cancel</button>'}</div></div>${err}
    ${aiSection(turn, v, reasons)}${
      S.flash && S.flash.trace === turn.trace_id ? `<div class="flash">${esc(S.flash.text)}</div>` : ''}</div>`;
}

const REASON_HINT = {
  missing: 'failure observed: what went wrong, in your own words / no failure observed: why it passes (optional)',
  failure: 'another failure reason, in your own words', conflict: 'another failure reason, in your own words',
  nofailure: 'a failure reason (switches the verdict) / why it passes (optional)'};

/* "No failure observed" is never offered beside a live failure reason; on a
   no-failure turn a failure reason switches the verdict (.switch, confirmed). */
function verdictButtons(v){
  if (v === 'missing') return '<button class="save">Failure observed</button> <button class="none">No failure observed</button>';
  if (v === 'nofailure') return '<button class="save switch">Failure observed (switches the verdict)</button> <button class="none">Save why it passes</button>';
  return '<button class="save">Save reason</button>';
}

/* One reason. An accepted suggestion's note is marked and has no edit/retract:
   it changes through its suggestion's decision. Modes show only under Axial coding. */
function reasonRow(a, label){
  const ai = a.source === 'accepted_suggestion';
  return `<div class="saved${a.no_failure ? '' : ' fail'}" data-id="${esc(a.id)}"><span class="verdict">${esc(label)}</span>${
    ai ? '<span class="meta">(AI, accepted)</span> ' : ''}${esc(a.note || '')}${
    a.step !== 'reply' ? ` <span class="anchor">at ${esc(a.step)}</span>` : ''}${ai ? '' : NOTE_BUTTONS}</div>${
    a.no_failure ? '' : modeRow(a)}`;
}

function wireNotes(){
  for (const b of document.querySelectorAll('#conv .addnote')){
    b.onclick = () => {
      const box = b.closest('section').querySelector(`.stepnote[data-step="${CSS.escape(b.dataset.step)}"]`);
      box.querySelector('.add').hidden = false;
      box.querySelector('textarea').focus();
    };
  }
  for (const box of document.querySelectorAll('.note')){
    const buttons = box.querySelectorAll('button');
    const post = async (no_failure) => {
      const ta = box.querySelector('textarea');
      const note = ta.value.trim();
      if (!no_failure && !note) return;
      /* A no-failure verdict keeps its reason: a close negative is only useful
         at axial coding if it says why it passes. Only a failure needs text. */
      // an edit keeps the edited note's step (the verdict box lists step notes too)
      const target = S.annotations.find(a => a.id === box.dataset.supersedes);
      const rec = {trace_id: box.dataset.trace, turn: Number(box.dataset.turn),
                   step: target ? target.step : box.dataset.step,
                   note,
                   no_failure: !!no_failure,
                   session_id: S.view.session_id, scenario_id: S.view.scenario_id,
                   ts: new Date().toISOString()};
      if (box.dataset.supersedes) rec.supersedes = box.dataset.supersedes;
      buttons.forEach(b => b.disabled = true);       // a double-click would append twice
      try {
        const drafts = snapshotDrafts();
        delete drafts[`${rec.trace_id}|${rec.turn}|${rec.step}`];   // this one is saved
        if (!await send(rec, box, drafts)) return;   // text stays; it is the only copy
      } finally {
        buttons.forEach(b => b.disabled = false);
      }
    };
    box.querySelector('.save').onclick = () => {
      if (!box.querySelector('.save').classList.contains('switch')) return post(false);
      if (!box.querySelector('textarea').value.trim()) return;
      if (!confirm('Switch verdict to failure observed? Your "no failure observed" note is replaced (kept in history).')) return;
      // one append: the failure reason supersedes the no-failure note
      if (!box.dataset.supersedes)
        box.dataset.supersedes = S.annotations.find(a => a.trace_id === box.dataset.trace && a.no_failure).id;
      post(false);
    };
    const none = box.querySelector('.none');
    if (none) none.onclick = () => post(true);
    const cancel = box.querySelector('.cancel');
    const more = box.querySelector('.addmore');
    if (more) more.onclick = () => {
      box.querySelector('.add').hidden = false; more.hidden = true;
      box.querySelector('textarea').focus();
    };
    if (cancel) cancel.onclick = () => {
      box.querySelector('textarea').value = '';
      delete box.dataset.supersedes;
      box.querySelector('.add').hidden = true;
      if (more) more.hidden = false;
    };

    for (const row of box.querySelectorAll('.saved')){
      const id = row.dataset.id;
      if (!row.querySelector('.edit')) continue;   // an accepted suggestion's note
      row.querySelector('.edit').onclick = () => {
        const add = box.querySelector('.add');
        if (add) add.hidden = false;
        const ta = box.querySelector('textarea');
        const a = S.annotations.find(x => x.id === id);
        ta.value = a ? (a.note || '') : '';
        box.dataset.supersedes = id;          // the next save replaces this record
        ta.focus();
        box.querySelector('.msg-err').textContent =
          'editing — saving replaces that note (the original stays in history)';
      };
      /* Withdraw inline, with an optional reason: the note stays visible struck
         through. It stays in the history but stops counting. */
      const wd = row.querySelector('.wd'), retract = row.querySelector('.retract');
      retract.onclick = () => { wd.hidden = false; retract.hidden = true; wd.querySelector('input').focus(); };
      wd.querySelector('.wd-cancel').onclick = () => {
        wd.querySelector('input').value = ''; wd.hidden = true; retract.hidden = false;
      };
      wd.querySelector('.wd-go').onclick = async () => {
        const btns = wd.querySelectorAll('button');
        btns.forEach(b => b.disabled = true);   // a second click would append a second tombstone
        try {
          const a = S.annotations.find(x => x.id === id);
          await send({trace_id: box.dataset.trace, turn: Number(a ? a.turn : box.dataset.turn),
                      step: a ? a.step : box.dataset.step, supersedes: id, retracted: true, ts: new Date().toISOString(),
                      reason: wd.querySelector('input').value.trim()},
                     box, snapshotDrafts());
        } finally {
          btns.forEach(b => b.disabled = false);
        }
      };
    }
  }
}

/* ---- Axial coding: a mode is attached to a NOTE. The row lists the modes whose
   source_annotation_ids hold this note; "+ add mode" opens an inline panel under
   the row (one at a time, S.pickerFor) listing the modes it is not in. Nothing is
   assigned until a mode card is clicked. */
const cutWords = (x, n) => {
  if (x.length <= n) return x;
  const s = x.slice(0, n - 1), sp = s.lastIndexOf(' ');
  return (sp > n / 2 ? s.slice(0, sp) : s).replace(/[\s,.;:]+$/, '') + '…';
};
function modeRow(a){
  if (!S.showAxial) return '';
  const inIt = m => (m.source_annotation_ids || []).includes(a.id);
  const chips = S.tax.modes.filter(inIt).map(m =>
    `<span class="chip">${esc(m.name)}<button class="unmode" data-mode="${esc(m.name)}" title="remove this note from ${esc(m.name)}">×</button></span>`).join('');
  const open = S.pickerFor === a.id;
  const row = `<div class="moderow" data-id="${esc(a.id)}"><span class="lbl">MODE</span>${chips}
    <button class="addmode-btn" aria-expanded="${open}">+ add mode</button><span class="stepref"></span></div>`;
  if (!open) return row;
  const cards = S.tax.modes.filter(m => !inIt(m))
    .sort((x, y) => (y.trace_count - x.trace_count) || x.name.localeCompare(y.name))
    .map(m => {
      const ex = m.closest_example;
      return `<button class="modecard" data-mode="${esc(m.name)}">
        <div class="nm"><b>${esc(m.name)}</b> · ${plural(m.trace_count, 'trace')}</div>
        <div class="df">${esc(m.definition || '')}</div>${ex ? `
        <div class="ex">e.g. ${esc(ex.scenario_id)}: “${esc(cutWords(ex.note || '', 140))}”</div>` : ''}</button>`;
    }).join('');
  return row + `<div class="modepick" data-id="${esc(a.id)}">
    <div class="ph">Add to a mode<button class="pclose" title="close (Esc)">close ×</button></div>
    ${cards || '<div class="meta">This note is already in every mode.</div>'}</div>`;
}

/* Open (or close, id null) the mode panel. Re-rendering keeps S the only
   source of truth for which panel is open; drafts survive via the snapshot. */
function setPicker(id){
  S.pickerFor = id;
  renderConversation(snapshotDrafts());
  if (id){
    const p = [...document.querySelectorAll('#conv .modepick')].find(x => x.dataset.id === id);
    const first = p && (p.querySelector('.modecard') || p.querySelector('.pclose'));
    if (first) first.focus({preventScroll: true});
  }
}

/* One POST for assign/unassign; returns the error text, or '' on success. */
async function patternsPost(kind, body){
  const r = await fetch('/api/patterns/' + kind, {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if (r.ok) return '';
  const err = await r.json().catch(() => ({}));
  return 'not saved: ' + (err.error || r.status);
}

async function afterPatterns(){
  try { S.withdrawn = await j('/api/withdrawn'); } catch (e) { console.error(e); }
  await renderTaxonomy(); renderProgress();
  if (S.view) renderConversation(snapshotDrafts());
}

function wireModes(){
  for (const row of document.querySelectorAll('#conv .moderow')){
    const msg = row.querySelector('.stepref');
    row.querySelector('.addmode-btn').onclick = () =>
      setPicker(S.pickerFor === row.dataset.id ? null : row.dataset.id);
    const panel = row.nextElementSibling;
    if (panel && panel.classList.contains('modepick')){
      panel.querySelector('.pclose').onclick = () => setPicker(null);
      const cards = panel.querySelectorAll('.modecard');
      for (const c of cards){
        c.onclick = async () => {
          cards.forEach(x => x.disabled = true);      // a double-click would assign twice
          const err = await patternsPost('assign', {annotation_id: row.dataset.id, mode: c.dataset.mode});
          if (err){ msg.textContent = err; cards.forEach(x => x.disabled = false); return; }
          S.pickerFor = null;
          await afterPatterns();
        };
      }
    }
    for (const b of row.querySelectorAll('.unmode')){
      b.onclick = async () => {
        b.disabled = true;
        const err = await patternsPost('unassign', {annotation_id: row.dataset.id, mode: b.dataset.mode});
        if (err){ msg.textContent = err; b.disabled = false; return; }
        await afterPatterns();
      };
    }
  }
}

/* ---- The conversation list. Every row's status is computed here from data the
   page already holds (annotations, suggestions, taxonomy modes); the index adds
   only batch membership. A turn is u(nreviewed), p(assed: notes, none a
   failure) or f(ailing: a live failure note). */
const TURN = {u: 'unreviewed', p: 'reviewed, no failure', f: 'has a failure note'};

function rowInfo(r){
  const notes = S.annotations.filter(a => r.trace_ids.includes(a.trace_id));
  const fails = notes.filter(a => !a.no_failure);
  const turns = r.trace_ids.map(t => !notes.some(a => a.trace_id === t) ? 'u'
    : fails.some(a => a.trace_id === t) ? 'f' : 'p');
  const failIds = new Set(fails.map(a => a.id));
  /* In a mode by one of its notes OR by an example trace, as the Taxonomy tab counts it. */
  const modes = S.tax.modes.filter(m => (m.source_annotation_ids || []).some(i => failIds.has(i))
    || (m.example_trace_ids || []).some(t => r.trace_ids.includes(t)));
  return {turns, failing: turns.filter(x => x === 'f').length, modes: modes.map(m => m.name),
          // what the old "Needs a decision" caught: a failure note in no mode, or a gone example
          needs: [...S.tax.unassigned, ...S.tax.gone].some(x => r.trace_ids.includes(x.trace_id)),
          pending: S.suggestions.some(sg => (sg.status || 'pending') === 'pending'
                                            && r.trace_ids.includes(sg.trace_id))};
}

/* Batch scope: 'sample' (any batch), 'pool' (not in the sample), or a batch name. */
const inBatch = (r, b) => b === 'sample' ? r.in_sample : b === 'pool' ? !r.in_sample : r.batch === b;
const STATUS = {all: ['all', () => true],
                unreviewed: ['unreviewed', r => !r.reviewed],
                failing: ['failing', (r, x) => x.failing > 0],
                pending: ['suggestion pending', (r, x) => x.pending],
                needs: ['needs a decision: no mode or gone example', (r, x) => x.needs]};

function matches(i, info, f){
  const r = S.index[i], x = info[i];
  return inBatch(r, f.batch) && STATUS[f.status][1](r, x) && (!f.mode || x.modes.includes(f.mode));
}

/* A stable working set. Membership is captured when a filter changes, on boot
   and on "refresh list" -- not re-filtered on every render, so a row does not
   vanish (or appear) the moment a verdict is saved. Its chips still update
   live; the header counts held rows that no longer match. Order is scenario
   id only: an order that depends on review state moves rows while you work. */
const sid = i => S.index[i] ? S.index[i].scenario_id : '';
function capture(){
  const info = S.index.map(rowInfo);
  S.held = S.index.map((_, i) => i).filter(i => matches(i, info, S.f)).sort((a, b) => sid(a).localeCompare(sid(b)));
}

/* The served set: the captured rows. The open conversation may be outside it
   (opened by a link or the URL): prev/next then move to its neighbours by
   scenario id. */
function navList(){ return S.held; }

/* URL hash state: #batch=&status=&mode=&s=. Filters are replaced in place;
   opening a conversation pushes, so back/forward step through what was opened. */
const reviewHash = () => '#' + new URLSearchParams({...S.f, s: sid(S.cur)}).toString();
function writeHash(push){
  const h = reviewHash();
  if (h === location.hash) return;
  S.hashSeen = h;
  history[push ? 'pushState' : 'replaceState'](null, '', h);
}

/* The Labels tab's own hash, told apart from Review's by tab=labels: #tab=labels&mode=<fqMode>&pair=<trace_id>|<mode>.
   Entering the tab pushes it; a pair or mode change replaces it. */
const isLabHash = () => new URLSearchParams(location.hash.slice(1)).get('tab') === 'labels';
function writeLabHash(push){
  const cur = S.lab.fq && S.lab.fq.items[S.lab.fi], p = {tab: 'labels', mode: S.lab.fqMode};
  if (cur) p.pair = cur.trace_id + '|' + cur.mode;
  const h = '#' + new URLSearchParams(p).toString();
  if (h === location.hash) return;
  S.hashSeen = h;
  history[push ? 'pushState' : 'replaceState'](null, '', h);
}

/* Filters and the open conversation from the hash. An unknown value falls back
   to its default rather than yielding an empty list; a known scenario opens even
   when filtered out; an unknown one opens the first row (nothing when the list is empty).
   A Labels hash records the wanted pair for renderFocus and leaves Review's state as it is
   (its defaults on first load). Returns true for a Labels hash. */
function applyHash(){
  const raw = new URLSearchParams(location.hash.slice(1)), lab = raw.get('tab') === 'labels';
  if (lab){
    S.lab.want = {mode: raw.get('mode') || '', pair: raw.get('pair') || ''};
    S.hashSeen = location.hash;
    if (S.reviewSet) return true;
  }
  const h = lab ? new URLSearchParams() : raw, batches = new Set(S.index.map(r => r.batch).filter(Boolean));
  const b = h.get('batch'), st = h.get('status'), m = h.get('mode');
  const f = {batch: b === 'sample' || b === 'pool' || batches.has(b) ? b : 'sample',
             status: Object.hasOwn(STATUS, st) ? st : 'all',   // not 'constructor' etc.
             mode: S.tax.modes.some(x => x.name === m) ? m : ''};
  if (!S.held.length || Object.keys(f).some(k => f[k] !== S.f[k])){ S.f = f; capture(); }
  const i = S.index.findIndex(r => r.scenario_id === h.get('s'));
  // A known conversation opens even outside the held list (it was opened from the
  // Suggestions or Taxonomy tab, or dropped by a refresh); only an unknown one
  // falls back to the first row.
  S.cur = i >= 0 ? i : S.held[0] ?? -1;
  S.reviewSet = true;
  if (lab) return true;
  writeHash(false);   // normalise: the URL shows what was actually applied
  S.hashSeen = location.hash;
  return false;
}

/* Back/forward, or a hash typed into the address bar. */
function onHash(){
  if (location.hash === S.hashSeen) return;
  const labOn = $('#labels').classList.contains('on');
  if (isLabHash()){
    applyHash();
    if (!labOn) setTab('labels');
    else if (!S.lab.busy) renderLabels();   // busy: the save's own render applies the wanted pair
    return;
  }
  // Back from Labels to the Review entry it was entered from: only the tab changes.
  if (labOn && location.hash === reviewHash()){ S.hashSeen = location.hash; setTab('review'); return; }
  // Declined: the browser already moved to the target entry; push the current
  // conversation back rather than overwrite the target: the target entry is kept;
  // forward entries are dropped, as with any new navigation.
  if (!mayLeave()){ labOn ? writeLabHash(true) : writeHash(true); return; }
  applyHash(); show();
  if (labOn) setTab('review');
}
window.addEventListener('popstate', onHash);
window.addEventListener('hashchange', onHash);

function openConv(i){
  S.cur = i; writeHash(true); show();
}

function listRow(i, x){
  const r = S.index[i];
  const chips = x.turns.map((t, k) => `<span class="tc ${t}" title="turn ${k + 1}: ${TURN[t]}"></span>`).join('');
  /* One line per conversation so more fit on screen: the chips carry the turn
     count, so it is not repeated as text; long mode names truncate (full on hover). */
  const role = r.user_role === 'support' ? 'support' : roleName(r.user_role);
  /* The chips are the whole status (count = turns, colour = reviewed / failing,
     position = which turn), so no separate reviewed/total pill; the right edge
     shows the batch instead. */
  return `<div class="lrow${i === S.cur ? ' cur' : ''}" data-i="${i}" title="${esc(r.scenario_id)} · ${
      esc(roleName(r.user_role))} · ${plural(r.turns, 'turn')} · ${r.turns_annotated} reviewed${
      x.failing ? `, ${x.failing} failing` : ''} · ${esc(r.batch || 'not in sample')}">
    <b>${esc(r.scenario_id.replace(/^support-/, ''))}</b><span class="role">${esc(role)}</span><span>${chips}</span>${
      x.pending ? '<span class="dia" title="an AI suggestion is pending">◆</span>' : ''}
    <span class="modes" title="${esc(x.modes.join(', '))}">${x.modes.map(m => `<span class="chip">${esc(m)}</span>`).join('')}</span>
    <span class="bt${r.batch ? '' : ' pool'}">${esc(r.batch || 'pool')}</span></div>`;
}

/* The batch filter grouped by hw4.md Part B batch, read from the manifest's
   part_b_batch; ids stay as they are (they key the manifest, suggestions and the
   URL hash), only the label says which handout batch and, for a depth search,
   which mode. A batch with no part_b_batch lands under "other". */
const PART_B = {1: 'Batch 1 · uniform + cluster', 2: 'Batch 2 · by user role',
                3: 'Batch 3 · depth search', 4: 'Batch 4 · final uniform'};
function batchOptions(names, opt){
  const meta = new Map((S.manifest.batches || []).map(b => [b.batch, b]));
  const groups = new Map(Object.keys(PART_B).map(k => [String(k), []]));
  for (const b of names){
    const m = meta.get(b) || {}, k = m.part_b_batch ? String(m.part_b_batch) : 'other';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(opt('batch', b, m.mode ? `${b} · ${m.mode.replaceAll('_', ' ')}` : b));
  }
  return [...groups].map(([k, opts]) => `<optgroup label="${esc(PART_B[k] || 'other')}${
      opts.length ? '' : ' (not drawn)'}">${opts.join('')}</optgroup>`).join('');
}

function renderList(){
  const info = S.index.map(rowInfo);
  const count = over => S.index.filter((_, i) => matches(i, info, {...S.f, ...over})).length;
  const opt = (key, value, label) => `<option value="${esc(value)}"${S.f[key] === value ? ' selected' : ''}>${
    esc(label)} (${count({[key]: value})})</option>`;
  const batches = [...new Set(S.index.map(r => r.batch).filter(Boolean))].sort();
  const L = navList();
  const warn = S.manifest.manifest_ok ? '' : `<div class="warn">Sample unreadable: ${
    esc(S.manifest.reason)}. Every conversation reads as "not in sample"; fix the manifest and reload.</div>`;
  $('#list').innerHTML = `<div class="filters">${warn}
      <label for="f-batch">Batch</label><select id="f-batch" data-f="batch">${opt('batch', 'sample', 'sample (all batches)')}${
        batchOptions(batches, opt)}${opt('batch', 'pool', 'not in sample (pool only)')}</select>
      <label for="f-status">Status</label><select id="f-status" data-f="status">${Object.entries(STATUS).map(([k, [label]]) =>
        opt('status', k, k === 'all' ? 'all statuses' : label)).join('')}</select>
      <label for="f-mode">Mode</label><select id="f-mode" data-f="mode">${opt('mode', '', 'any mode')}${S.tax.modes.map(m =>
        opt('mode', m.name, m.name + (m.status === 'dropped' ? ' (retired)' : ''))).join('')}</select>
      <div class="meta scope">${scopeLine(L, count({status: 'all', mode: ''}), L.filter(i => !matches(i, info, S.f)).length)}</div></div>`
    + (L.map(i => listRow(i, info[i])).join('') || '<p class="empty">no conversation matches</p>');
  for (const sel of document.querySelectorAll('#list select')){
    sel.onchange = () => {
      S.f[sel.dataset.f] = sel.value; capture(); writeHash(false);
      /* Open the first match when the open conversation left the list, or j/k
         would continue from its position in the middle of the new list. */
      const L = navList();
      if (L.length && !L.includes(S.cur) && mayLeave()){ S.cur = L[0]; writeHash(false); show(); return; }
      renderPos();
      if (sel.dataset.f === 'status' && S.f.status === 'failing'){ S.failAt = -1; nextFailure(); }
    };
  }
  const refresh = document.querySelector('#list .refresh');
  if (refresh) refresh.onclick = () => { capture(); renderPos(); };
  for (const el of document.querySelectorAll('#list .lrow')){
    el.onclick = () => {
      const i = Number(el.dataset.i);
      if (i !== S.cur && mayLeave()) openConv(i);
    };
  }
  return L;
}

/* "depth-4 · all statuses · any mode · 2 of 2": the filters in words, the held
   rows of the batch scope, and how many held rows no longer match. */
function scopeLine(L, scope, changed){
  const batch = {sample: 'sample (all batches)', pool: 'not in sample'}[S.f.batch] || S.f.batch;
  const status = S.f.status === 'all' ? 'all statuses' : STATUS[S.f.status][0];
  return `${esc(batch)} · ${esc(status)} · ${esc(S.f.mode || 'any mode')} · <b>${L.length}</b> of ${scope}
    <button class="refresh linkbtn" title="re-apply the filters to current data">↻ refresh list${
      changed ? ` · ${changed} changed` : ''}</button>`;
}

function renderPos(){
  const L = renderList(), k = L.indexOf(S.cur);
  $('#pos').textContent = `${k < 0 ? '–' : k + 1} / ${L.length}`;
}

/* One POST path for save, edit and retract, so the error handling is identical. */
async function send(rec, box, drafts){
  /* Two phases: only the POST may report "not saved". Once it succeeded, a
     failed refresh must still return true, or a retry writes a second note. */
  try {
    const r = await fetch('/api/annotations', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(rec)});
    if (!r.ok){
      const err = await r.json().catch(() => ({}));
      box.querySelector('.msg-err').textContent = 'not saved: ' + (err.error || r.status);
      return false;
    }
  } catch (e) {
    box.querySelector('.msg-err').textContent = 'not saved (' + e + ') — text kept';
    return false;
  }
  box.querySelector('.msg-err').textContent = '';
  try {
    S.annotations = await j('/api/annotations');
    S.index = await j('/api/index');
    S.superseded = (await j('/api/history')).superseded_counts;
    S.withdrawn = await j('/api/withdrawn');
    renderProgress(); await renderTaxonomy();
    if (drafts) renderConversation(drafts);   // one path for save, edit and retract
  } catch (e) {
    console.error(e);
    box.querySelector('.msg-err').textContent = 'saved — refresh failed, reload the page (' + e + ')';
  }
  return true;
}

/* keepNulls: on an evidence card a null IS the evidence — order 8002 is
   `delivered` with delivered_at null, and hiding the row leaves the reviewer
   unable to distinguish "missing" from "not rendered". */
function kv(obj, skip, keepNulls){
  const rows = Object.entries(obj)
    .filter(([k,v]) => !skip.includes(k)
                       && (keepNulls || (v !== null && v !== undefined))
                       && !(Array.isArray(v) && !v.length))
    .map(([k,v]) => `<tr><td class="k">${esc(k)}</td><td>${
      Array.isArray(v) ? v.map(x => esc(JSON.stringify(x))).join('<br>')
      : (v === null || v === undefined) ? '<span class="k">—</span>'
      : esc(v)}</td></tr>`);
  return `<table>${rows.join('')}</table>`;
}

function renderRail(){ $('#rail').innerHTML = railHtml(S.view); }

/* The evidence cards of one session view (facts, policy, world_asof): Review's rail and the Labels
   card's Evidence section. Styled under .rail or .ev-rail. */
function railHtml(view){
  const f = view.facts, p = view.policy, out = [];
  out.push(`<h4>Evidence <span class="k">as of ${esc(view.world_asof)}</span></h4>`);
  for (const o of f.orders){
    out.push('<div class="card">');
    out.push(`<div><code>order ${o.order_id}</code></div>`);
    out.push((o.flags || []).map(x => `<span class="flag">${esc(x)}</span>`).join(''));
    out.push(kv(o, ['order_id','flags'], true));
    out.push('</div>');
  }
  for (const pr of f.products){
    out.push('<div class="card">');
    out.push(`<div><code>product ${pr.product_id}</code></div>`);
    out.push((pr.flags || []).map(x => `<span class="flag">${esc(x)}</span>`).join(''));
    out.push(kv(pr, ['product_id','flags'], true));
    out.push('</div>');
  }
  if (!f.orders.length && !f.products.length)
    out.push('<div class="card">no order or product referenced</div>');
  const list = (xs) => xs.length
    ? `<ul class="plain">${xs.map(x => `<li><code>${esc(x)}</code></li>`).join('')}</ul>`
    : '<ul class="plain"><li>none</li></ul>';
  out.push('<h4>Policy</h4><div class="card">');
  out.push(`<div class="k">opened (get_policy)</div>${list(p.opened)}`);
  out.push(`<div class="k">surfaced in search only</div>${list(p.surfaced)}`);
  out.push(`<div class="k">cited in replies</div>${list(p.cited)}`);
  out.push(`<div class="${p.cited_not_opened.length ? 'gap' : 'k'}">cited but never opened: ${
    p.cited_not_opened.length ? esc(p.cited_not_opened.join(', ')) : '—'}</div>`);
  if (p.cited_not_seen_at_all.length)
    out.push(`<div class="gap">cited but never seen at all: ${
      esc(p.cited_not_seen_at_all.join(', '))}</div>`);
  out.push('</div>');
  return out.join('');
}

/* ---- AI suggestions: agent depth-search hits the reviewer accepts or rejects.
   A rejection needs a reason (the boundary that excluded the trace) and is kept;
   an acceptance becomes the reviewer's own failure note on the server. */
const modeDef = name => (S.modes.find(m => m.name === name) || {}).definition || '';

/* Searches whose quote is just the reply's first sentence (depth_search.py
   quotes with re.compile(r".")): the failure is an absence, so the quote is not
   evidence of it: the search's reason is the evidence, shown once. */
const ABSENCE_MODES = new Set(['missed_mandatory_escalation', 'skipped_order_search']);
const evidenceLines = sg => ABSENCE_MODES.has(sg.mode) ? `<div>Evidence: ${esc(sg.reason || sg.evidence || '')}</div>`
  : `<div>Why: ${esc(sg.reason || sg.evidence || '')}</div>${sg.quote ? `<div>Evidence: “${esc(sg.quote)}”</div>` : ''}`;

/* Collapsed to one line until the turn has a verdict, so the reviewer reads
   the turn before weighing the search's claim. */
function aiSection(turn, v, reasons){
  if (!S.showSugg) return '';
  const mine = S.suggestions.filter(sg => sg.trace_id === turn.trace_id);
  if (!mine.length) return '';
  const pending = mine.filter(sg => (sg.status || 'pending') === 'pending');
  if (v === 'missing' && pending.length && !S.aiOpen.has(turn.trace_id))
    return `<div class="vsec ai"><button class="aishow linkbtn" data-trace="${esc(turn.trace_id)}">AI suggests a reason: ${
      esc(pending.map(sg => sg.mode).join(', '))} ▸</button></div>`;
  return `<div class="vsec ai">${mine.map(sg => aiCard(sg, v, reasons)).join('')}</div>`;
}

/* What a decided suggestion did, in the reasons' numbering. */
function decisionSummary(sg, reasons){
  const d = sg.decision || {}, n = id => reasons.findIndex(a => a.id === id) + 1;
  if (sg.status === 'rejected') return 'not a failure here';
  if (d.attached) return n(d.attached.annotation_id) ? `covered by reason ${n(d.attached.annotation_id)}` : 'covered by your reason';
  const own = reasons.find(a => a.suggestion_id === sg.id);
  return own ? `added as reason ${n(own.id)}` : 'added (its note is no longer live)';
}

function aiCard(sg, v, reasons){
  const st = sg.status || 'pending', dec = sg.decision || {};
  // the server's default text for "covered" adds nothing to decisionSummary
  const d = dec.attached && dec.reason === `covered by reason ${dec.attached.annotation_id}` ? {...dec, reason: ''} : dec;
  if (st !== 'pending' && !S.expanded.has(sg.id))
    return `<div class="sugg done" data-sid="${esc(sg.id)}"><span class="lbl">AI SUGGESTED</span> <b>${esc(sg.mode)}</b> — ${
      esc(decisionSummary(sg, reasons))}${d.reason ? ': ' + esc(d.reason) : ''}<button class="chg">change</button></div>`;
  return `<div class="sugg" data-sid="${esc(sg.id)}">
    <div><span class="lbl">AI suggests a reason:</span> <b>${esc(sg.mode)}</b>${sg.strength === 'weak' ? ' (possible)' : ''}</div>
    ${evidenceLines(sg)}
    <div class="prov">turn ${esc(sg.turn)} · ${esc(sg.step)} · ${esc(sg.strength || '')} · ${esc(sg.signal || '')} · <details class="def">
      <summary>definition</summary>${esc(modeDef(sg.mode))}</details></div>${
    st !== 'pending' ? `<div class="meta">now ${esc(decisionSummary(sg, reasons))}${d.reason ? ': ' + esc(d.reason) : ''} — you can change it</div>` : ''}
    <div class="row"><button class="acc">${v === 'nofailure' ? 'Add as reason — switches verdict to failure observed' : 'Add as reason'}</button>
      ${coverControl(sg, reasons)} <button class="rej">Not a failure here</button>
      <span class="msg-err" style="color:var(--warn);font-size:12px"></span></div>
    <div class="aiform" hidden><textarea></textarea>
      <div class="row"><button class="go"></button> <button class="ai-cancel">cancel</button></div></div></div>`;
}

/* "Covered by my reason" attaches one of YOUR failure reasons on this turn to
   the suggested mode. A reason already in another mode cannot (one failure,
   one mode); with several, the reviewer picks which. */
function coverControl(sg, reasons){
  const inOther = a => (S.tax.modes.find(m => m.name !== sg.mode && (m.source_annotation_ids || []).includes(a.id)) || {}).name;
  const own = reasons.map((a, k) => ({a, n: k + 1, other: inOther(a)})).filter(x => x.a.source !== 'accepted_suggestion');
  const ok = own.filter(x => !x.other);
  const why = !own.length ? 'no failure reason of yours on this turn'
    : !ok.length ? own.map(x => `your reason ${x.n} is in mode ${x.other}`).join('; ') : '';
  const pick = own.length > 1 ? `<select class="cover-pick">${own.map(x => `<option value="${esc(x.a.id)}"${
    x.other ? ' disabled' : ''}>reason ${x.n}${x.other ? ' (in mode ' + esc(x.other) + ')' : ''}</option>`).join('')}</select> ` : '';
  return `${ok.length ? pick : ''}<span title="${esc(why)}"><button class="cov"${
    ok.length === 1 && !pick ? ` data-annotation="${esc(ok[0].a.id)}"` : ''}${why ? ' disabled' : ''}>Covered by my reason</button></span>`;
}

function wireSuggestions(){
  for (const b of document.querySelectorAll('#conv .aishow')){
    b.onclick = () => { S.aiOpen.add(b.dataset.trace); renderConversation(snapshotDrafts()); };
  }
  for (const b of document.querySelectorAll('#conv .sugg .chg')){
    b.onclick = () => { S.expanded.add(b.closest('.sugg').dataset.sid); renderConversation(snapshotDrafts()); };
  }
  for (const card of document.querySelectorAll('#conv .sugg[data-sid]:not(.done)')){
    const sid = card.dataset.sid, ta = card.querySelector('.aiform textarea');
    card.querySelector('.acc').onclick = () => openAiForm(card, 'acc');
    card.querySelector('.rej').onclick = () => openAiForm(card, 'rej');
    card.querySelector('.ai-cancel').onclick = () => { ta.value = ''; card.querySelector('.aiform').hidden = true; };
    const cov = card.querySelector('.cov'), pick = card.querySelector('.cover-pick');
    cov.onclick = () => decide(sid, 'accepted', '', card, null, pick ? pick.value : cov.dataset.annotation);
    card.querySelector('.go').onclick = () =>
      decide(sid, card.dataset.form === 'rej' ? 'rejected' : 'accepted', ta.value, card);
  }
}

/* Only a rejection needs the reviewer's words (they become the mode boundary).
   "Add as reason" opens the AI's why, editable, so what gets saved is seen
   before it is confirmed; "Covered by my reason" needs no text. */
function openAiForm(card, kind, text){
  const sg = S.suggestions.find(x => x.id === card.dataset.sid) || {};
  const form = card.querySelector('.aiform'), ta = form.querySelector('textarea'), go = form.querySelector('.go');
  card.dataset.form = kind; form.hidden = false;
  ta.value = text ?? (kind === 'acc' ? (sg.reason || sg.evidence || '') : '');
  ta.placeholder = kind === 'acc' ? 'the reason to add (the AI\'s why, edit if needed)'
    : 'why this trace does not show this failure — becomes the mode boundary (required)';
  go.textContent = kind === 'acc' ? card.querySelector('.acc').textContent : 'Confirm: not a failure here';
  const gate = () => { go.disabled = kind === 'rej' && !ta.value.trim(); };
  ta.oninput = gate; gate();
  if (text === undefined) ta.focus();   // not when a re-render restores a draft
}

/* annotationId: "covered by my reason" -- the server attaches that note to the
   mode, writes none, and withdraws a live no-failure note in the same write. */
async function decide(id, decision, reason, card, verdict, annotationId){
  const buttons = card.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);            // a double-click would 409
  let r;
  try {   // only the POST may report "not saved" (see send())
    r = await fetch('/api/suggestions/decision', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id, decision, reason, ...(verdict ? {verdict} : {}),
                            ...(annotationId ? {annotation_id: annotationId} : {})})});
    if (!r.ok){
      const err = await r.json().catch(() => ({}));
      card.querySelector('.msg-err').textContent = 'not saved: ' + (err.error || r.status);
      buttons.forEach(b => b.disabled = false);
      return false;
    }
  } catch (e) {
    card.querySelector('.msg-err').textContent = 'not saved (' + e + ')';
    buttons.forEach(b => b.disabled = false);
    return false;
  }
  try {
    const body = await r.json().catch(() => ({}));
    const mu = body.mode_update;
    S.flash = mu && mu.length ? {trace: (body.suggestion || {}).trace_id,
                    text: mu.map(u => `${u.action === 'added' ? 'added to' : 'removed from'} ${u.mode} (${u.count})`).join('; ')} : null;
    const drafts = snapshotDrafts();
    delete drafts['sg|' + id];   // this card's reason is now saved
    S.expanded.delete(id);
    S.suggestions = await j('/api/suggestions');
    S.annotations = await j('/api/annotations');
    S.index = await j('/api/index');
    S.superseded = (await j('/api/history')).superseded_counts;
    S.withdrawn = await j('/api/withdrawn');
    await renderTaxonomy();
    renderConversation(drafts); renderSuggestions(); renderProgress();
  } catch (e) {
    console.error(e);
    const err = card.querySelector('.msg-err');
    if (err) err.textContent = 'saved — refresh failed, reload the page (' + e + ')';
  } finally {
    buttons.forEach(b => b.disabled = false);
  }
  return true;   // the decision was saved, even if the refresh failed
}

function renderSuggestions(){
  const n = st => S.suggestions.filter(x => (x.status || 'pending') === st).length;
  const rows = S.suggestions.map(sg => {
    const served = S.index.findIndex(r => r.trace_ids.includes(sg.trace_id));
    return `<tr class="row" data-i="${served}"><td>${esc((sg.status || 'pending'))}</td>
      <td>${esc(sg.scenario_id)}${served < 0 ? ' <span class="meta">(not served)</span>' : ''}</td>
      <td><b>${esc(sg.mode)}</b><div class="meta">${esc(sg.signal)}</div></td>
      <td>${esc(sg.evidence)}${sg.decision && sg.decision.reason
        ? `<div class="meta">reason: ${esc(sg.decision.reason)}</div>` : ''}</td></tr>`;
  }).join('');
  $('#sugg').innerHTML = S.suggestions.length
    ? `<p>${n('pending')} pending · ${n('accepted')} accepted · ${n('rejected')} rejected.
         Click a row to open the conversation and decide there.</p>
       <table class="slist">${rows}</table>`
    : '<p class="empty">No suggestions yet. The agent writes them to analysis/state/suggestions.json.</p>';
  for (const tr of document.querySelectorAll('#sugg tr.row')){
    tr.onclick = () => {
      const i = Number(tr.dataset.i);
      if (i < 0 || !mayLeave()) return;
      openConv(i);
      document.querySelector('.tabs button[data-tab="review"]').click();
    };
  }
}

/* A scenario in the pool opens it on the Review tab; any other is plain text. */
function scenLink(sid){
  const i = S.index.findIndex(r => r.scenario_id === sid);
  return i < 0 ? esc(sid) : `<a href="#" class="open" data-i="${i}">${esc(sid)}</a>`;
}

const alsoIn = (xs, label = 'also in') => xs && xs.length ? ` <span class="meta">${esc(label)}: ${esc(xs.join(', '))}</span>` : '';

/* `mode` given: a positive, with a [Remove] (by its note, or by trace when the
   row has no source note). Close negatives pass none. */
function exampleRow(e, mode){
  const where = e.scenario_id ? `${scenLink(e.scenario_id)} (t${esc(e.turn)})` : `<code>${esc(e.trace_id)}</code>`;
  const rm = mode ? ` <button class="unassign" data-mode="${esc(mode)}" ${e.annotation_id
      ? `data-annotation="${esc(e.annotation_id)}"` : `data-trace="${esc(e.trace_id)}"`}>Remove</button>` : '';
  return `<li>${where} ${e.note == null ? '<span class="meta">no live note</span>' : esc(e.note)}${
    e.from_suggestion ? ' <span class="meta">(accepted AI suggestion)</span>' : ''}${alsoIn(e.in_modes)}${rm}</li>`;
}

/* Never throws: a refresh that fails after a successful save must not read as
   "not saved" to the caller (a retry would write a second note). */
async function renderTaxonomy(){
  try { await loadTaxonomy(); }
  catch (e) {
    console.error(e);
    const meta = $('#h-meta');
    if (meta && !meta.textContent.includes('taxonomy failed')) meta.textContent += ` · taxonomy failed to load (${e.message || e})`;
  }
}

async function loadTaxonomy(){
  const t = await j('/api/taxonomy');
  if (!t || !Array.isArray(t.modes)) throw new Error((t && t.error) || 'bad /api/taxonomy response');
  S.tax = t;
  const names = t.modes.map(m => `<option value="${esc(m.name)}">${esc(m.name)}</option>`).join('');
  const un = t.unassigned.map(u => `<div class="card"><b>${scenLink(u.scenario_id)}</b> · t${esc(u.turn)}${alsoIn(u.in_modes, 'trace also listed in')}
      <div>${esc(u.note)}</div>
      <select><option value="" disabled selected>choose a mode</option>${names}</select> <button class="assign" data-annotation="${esc(u.annotation_id)}">Assign</button>
      <span class="stepref"></span></div>`).join('');
  const where = g => g.scenario_id ? scenLink(g.scenario_id) : `<code>${esc(g.trace_id)}</code>`;
  const gone = t.gone.map(g => g.kind === 'no_note'
    ? `<div class="card"><b>${where(g)}</b> · t${esc(g.turn)} <span class="meta">in ${esc(g.mode)}</span>
      <div>listed as example but no note recorded</div>
      <span class="meta">assign its failure note to ${esc(g.mode)}</span></div>`
    : `<div class="card"><b>${where(g)}</b> · t${esc(g.turn)} <span class="meta">in ${esc(g.mode)}</span>
      <div>evidence note was withdrawn or changed to no failure</div>
      <div class="meta">${g.live_note ? 'latest note on this trace: ' + esc(g.live_note.note) : 'no live note on this trace'}</div>
      <button class="unassign" data-annotation="${esc(g.annotation_id)}" data-mode="${esc(g.mode)}">Remove from ${esc(g.mode)}</button>
      <span class="stepref"></span></div>`).join('');

/* Focus queue: the pairs that need reading (all modes), or a careful pass over one mode, each shown

const quotesIn = ev => [...(ev || '').matchAll(/(?<![A-Za-z])['‘"“]([^"“”‘]{8,}?)['’"”](?![A-Za-z])/g)]

  for (const [a, b] of spans){ if (a < at) continue; out += esc(plain.slice(at, a)) + '<mark>' + esc(plain.slice(a, b)) + '</mark>'; at = b; }

  for (const s of quotesIn(ev)){
    const q = norm(s);
    for (let at = t.indexOf(q); at >= 0; at = t.indexOf(q, at + 1)){

function policySource(turns, id){

  if ($('#fq-cancel')) $('#fq-cancel').onclick = () => {
    if (S.lab.busy) return;
    delete S.lab.drafts[key]; delete S.lab.revising[key]; syncUnload(); renderFocus();
  };
  /* One save path: append a record (the server keeps the blind answer and the history), then show
     step 2 on the same pair. An `unchanged` reply wrote nothing and says so. */
  $('#fq-save').onclick = async () => {
    if (S.lab.busy || !why()[0]) return;
    S.lab.busy = true;                            // navigation and keys wait: the render below must follow this pair
    box.querySelectorAll('.fq-card button').forEach(b => b.disabled = true);
    const r = await postLabel({mode: cur.mode, trace_id: cur.trace_id, label: d.verdict, evidence: d.text.trim(),
                               accepted_via: 'focus', proposal_source: p ? p.source : null});
    if (r.err){
      S.lab.busy = false; S.lab.msg[key] = r.err;
      box.querySelectorAll('.fq-card button').forEach(b => b.disabled = false);
      updateSave(); return;
    }
    S.lab.msg[key] = r.body.unchanged ? 'nothing changed' : '';
    /* The draft goes only once the queue shows the saved record; a failed reload keeps it on screen. */
    try { await reloadQueue(key); delete S.lab.drafts[key]; delete S.lab.revising[key]; syncUnload(); }
    catch (e) { S.lab.msg[key] = `saved, but the queue did not reload: ${e.message || e}`; }
    finally { S.lab.busy = false; }
    renderFocus();
  };
}
/* ---- One key map for Review and the Labels focus view: j/k previous/next visible row, Space and
   Shift+Space scroll the conversation pane, ? toggles the key list. Keys are lowercased in both. */
const typingIn = e => ['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName);
const KEYS = {
  review: [['j / k', 'previous / next conversation in the list'], ['g', 'next failure note'],
           ['Space / Shift+Space', 'scroll the conversation down / up'], ['Esc', 'close the mode panel'], ['?', 'this key list']],
  labels: [['j / k', 'previous / next row in the selected chip'], ['F / N', 'select Failure / No failure (step 1 Decide; never saves)'],
           ['Cmd+Enter', 'Save (step 1; anywhere in the card, the justification box included)'], ['R', 'Revise your saved answer (step 2 Compare)'],
           ['S', 'next pair still to do'], ['Esc', 'close the source box, then leave the justification box'],
           ['Space / Shift+Space', 'scroll the conversation down / up'], ['?', 'this key list']]};
function toggleKeys(tab){
  const el = $('#keys');
  if (!el.hidden){ el.hidden = true; return; }
  el.innerHTML = `<table>${KEYS[tab].map(([k, v]) => `<tr><td>${k.split(' / ').map(x => `<kbd>${esc(x)}</kbd>`).join(' / ')}</td><td>${esc(v)}</td></tr>`).join('')}</table>`;
  el.hidden = false;
}
/* Scroll the pane that holds `el` (its nearest scrolling ancestor, else the page) by 85% of its height. */
function scrollPane(el, dir){
  let s = el;
  while (s && s !== document.body && !/(auto|scroll)/.test(getComputedStyle(s).overflowY)) s = s.parentElement;
  if (s && s !== document.body) s.scrollBy(0, dir * 0.85 * s.clientHeight);
  else scrollBy(0, dir * 0.85 * (innerHeight - document.querySelector('header').offsetHeight));
}
/* Space and ? for a tab; true when handled. Space is always prevented, so it never presses a focused
   button (a Failure button above all). Callers skip this while typing. */
function pageKeys(e, tab, pane){
  if (e.metaKey || e.ctrlKey || e.altKey) return false;
  if (e.key === ' '){ e.preventDefault(); if (pane) scrollPane(pane, e.shiftKey ? -1 : 1); return true; }
  if (e.key === '?'){ e.preventDefault(); if (!e.repeat) toggleKeys(tab); return true; }
  return false;
}
/* Some browsers press a focused button on Space's keyup: prevent that too, in the two tabs that own Space. */
document.addEventListener('keyup', e => {
  if (e.key === ' ' && !typingIn(e) && ($('#review').classList.contains('on')
      || $('#labels').classList.contains('on'))) e.preventDefault();
});
/* Labels: walk the rendered list rows in DOM order by clicking the neighbour, so the row's own click
   handler (busy lock, drafts) applies. The open row may be filtered out: then its neighbours by index. */
function labStep(dir){
  if (S.lab.busy) return;
  const rows = [...document.querySelectorAll('#lab .fq-list [data-k]')], at = rows.findIndex(r => r.classList.contains('cur'));
  const el = at >= 0 ? rows[at + dir]
    : dir > 0 ? rows.find(r => Number(r.dataset.k) > S.lab.fi) : rows.filter(r => Number(r.dataset.k) < S.lab.fi).pop();
  if (el) el.click();
}
document.addEventListener('keydown', e => {
  if (!$('#labels').classList.contains('on')) return;
  /* Esc peels one layer: an open source box first, then the justification box (blur), then the key list. */
  if (e.key === 'Escape'){
    const srcX = document.querySelector('#lab .src-box .src-x');
    if (srcX){ e.preventDefault(); srcX.click(); return; }
    if (e.target.id === 'fq-ev'){ e.target.blur(); return; }
    if (!$('#keys').hidden){ $('#keys').hidden = true; return; }
  }
  if (!typingIn(e) && pageKeys(e, 'labels', $('#lab .fq-conv'))) return;   // scrolling is not an action: allowed while saving
  if (S.lab.busy) return;                            // no label or navigation key while a save is in flight
  /* Cmd/Ctrl+Enter: Save, from anywhere in the card (the justification box included) or with nothing
     focused. A disabled Save ignores the click. */
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !e.altKey && $('#fq-save')
      && (e.target === document.body || e.target.closest('#lab .fq-card'))){
    e.preventDefault(); if (!e.repeat) $('#fq-save').click(); return;
  }
  if (typingIn(e)) return;
  if (e.repeat) return;                              // holding a key must not act on the next pair too
  if (e.metaKey || e.ctrlKey || e.altKey) return;   // leave Cmd/Ctrl-F and friends to the browser
  /* Absolute keys, the same on every card: F = Failure, N = No failure, both select only. No
     Enter-to-agree: the fast path must not lean toward the AI's answer. */
  const k = e.key.toLowerCase();
  if (k === 'j') labStep(-1);
  else if (k === 'k') labStep(1);
  else if (k === 'f' && $('#fq-1')) $('#fq-1').click();
  else if (k === 'n' && $('#fq-0')) $('#fq-0').click();
  else if (k === 'r' && $('#fq-revise')) $('#fq-revise').click();
  else if (k === 's') labNextTodo();
});

/* The Labels tab is the focus view only (the Table and bulk accepts view is gone). */
async function renderLabels(){ return renderFocus(); }

function setTab(tab){
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === tab));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === tab));
  $('#hrow-review').hidden = tab !== 'review';
  $('#keys').hidden = true;   // its content belongs to the tab it was opened on
  if (tab === 'labels') renderLabels().catch(e => { $('#lab').textContent = `labels failed to load: ${e.message || e}`; });
  if (tab === 'judge') renderJudge().catch(e => { $('#jv').textContent = `judge view failed to load: ${e.message || e}`; });
}

/* HW5 Part C (hw5.md:203): one judge version's cached verdict and critique beside the live human label,
   per trace of a split. Read-only; the server refuses test rows for a judge that is not frozen. */
S.jv = {judge:'', split:'dev', dis:true, last:'', seen:new Set()};
async function renderJudge(){
  const box = $('#jv');
  const focusId = box.contains(document.activeElement) ? document.activeElement.id : '';
  const {judges} = await j('/api/judges');
  if (!judges.length){ box.textContent = 'No judge is registered yet. Register one with run_development in analysis/run_judges.py.'; return; }
  if (!judges.some(x => x.judge_id === S.jv.judge)) S.jv.judge = judges[judges.length - 1].judge_id;
  const res = await fetch(`/api/judge/${encodeURIComponent(S.jv.judge)}?split=${S.jv.split}`);
  const d = await res.json();
  const cur = judges.find(x => x.judge_id === S.jv.judge);
  const head = `<div class="jhead">
    <label>Judge <select id="jv-judge">${judges.map(x => `<option value="${esc(x.judge_id)}"${x.judge_id === S.jv.judge ? ' selected' : ''}>${esc(x.judge_id)}</option>`).join('')}</select></label>
    <label>Split <select id="jv-split">${['dev', 'test'].map(s => `<option${s === S.jv.split ? ' selected' : ''}>${s}</option>`).join('')}</select></label>
    <label><input type="checkbox" id="jv-dis"${S.jv.dis ? ' checked' : ''}> Disagreements only</label>
    <span class="who">${esc(cur.model)}, ${esc(cur.status)}${cur.input ? `; ${esc(cur.input)}` : ''}</span></div>`;
  let body, live = '';
  const tag = v => v ? `<span class="tag ${v === 'Fail' ? 'fail' : 'pass'}">${v}</span>` : '—';
  if (!res.ok) body = live = `<p>${esc(d.error || res.statusText)}</p>`;
  else {
    const m = d.metrics, f = x => x == null ? '—' : x.toFixed(2);
    const total = m.human_pass + m.human_fail, rare = total > 0 && m.human_fail / total < 0.25;
    /* A rate's card: the point estimate is the headline, its 95% Wilson interval sits right beside it
       (one unit to read), and the count behind it goes underneath. */
    const rate = (k, gloss, num, den, r, iv) => `<div class="cell rate"><div class="k">${k}<span>${gloss}</span></div>
        <div class="big">${f(r)}${iv[0] == null ? '' : ` <span class="iv">95% CI ${f(iv[0])}–${f(iv[1])}</span>`}</div>
        <div class="pt">${num} of ${den}</div></div>`;
    const jx = m.tpr != null && m.tnr != null ? f(m.tpr + m.tnr - 1) : '—';
    const fnN = d.rows.filter(r => r.agree === false && r.verdict === 'Fail').length;
    const fpN = d.rows.filter(r => r.agree === false && r.verdict === 'Pass').length;
    const n = d.rows.filter(r => r.agree !== null).length, dis = fnN + fpN;
    /* Disagreements first; within them judge Fail on your Pass (read the critique's deciding line)
       before judge Pass on your Fail (read your evidence). Stable: split order within each group. */
    const rank = r => r.agree !== false ? 2 : r.verdict === 'Fail' ? 0 : 1;
    const rows = d.rows.filter(r => !S.jv.dis || r.agree === false).sort((a, b) => rank(a) - rank(b));
    /* The deciding lines of a critique ("Qn: yes" in v4/v5, an unsourced claim in v1-v3) stay in view;
       the other answers fold under them. One segment per line and per "Qn:" answer: gpt-4o-mini often
       writes all six on one line. A critique with no deciding line (prose, v0) shows in full. */
    const hit = l => /^\s*Q\d+:\s*yes\b|\|\s*(no source|SOURCE:\s*none)\b/i.test(l);
    const crit = t => { const ls = (t || '—').split('\n').flatMap(l => l.split(/(?=\bQ\d+:\s)/)).map(s => s.trim()).filter(Boolean).map(esc);
      if (!ls.some(hit)) return ls.join('\n');
      const other = ls.filter(l => !hit(l));
      return ls.filter(hit).map(l => `<b>${l}</b>`).join('\n') + (other.length
        ? `<details><summary>${other.length} other answer${other.length === 1 ? '' : 's'}</summary><span class="dim">${other.join('\n')}</span></details>` : ''); };
    const reviewHref = sid => '#' + new URLSearchParams({...S.f, s: sid}).toString();
    const labHref = r => '#' + new URLSearchParams({tab: 'labels', mode: cur.mode, pair: `${r.trace_id}|${cur.mode}`}).toString();
    const kinds = `${fnN} judge Fail on your Pass (false alarm, FN), ${fpN} judge Pass on your Fail (missed failure, FP)${m.no_verdict ? `, ${m.no_verdict} without a verdict` : ''}`;
    live = `${dis} of ${n} judged conversations disagree with your label: ${kinds}.`;
    body = `<div class="band">
        <div class="cell sample"><div class="k">Tested<span>Conversations on the ${esc(S.jv.split)} split, by your label.</span></div>
          <div class="big">${total}</div><div class="pt">${tag('Pass')} ${m.human_pass} &nbsp; ${tag('Fail')} ${m.human_fail}</div></div>
        ${rate('TPR', 'The judge passes conversations you labeled Pass.', m.tp, m.human_pass, m.tpr, m.tpr_interval)}
        ${rate('TNR', 'The judge fails conversations you labeled Fail.', m.tn, m.human_fail, m.tnr, m.tnr_interval)}
        <div class="cell cmw">
          <table class="cm"><tr><th></th><th scope="col">Your ${tag('Pass')} (${m.human_pass})</th><th scope="col">Your ${tag('Fail')} (${m.human_fail})</th></tr>
            <tr><th scope="row">Judge ${tag('Pass')}</th><td><b>${m.tp}</b><span>TP</span></td><td><b>${m.fp}</b><span>FP, missed failure</span></td></tr>
            <tr><th scope="row">Judge ${tag('Fail')}</th><td><b>${m.fn}</b><span>FN, false alarm</span></td><td><b>${m.tn}</b><span>TN</span></td></tr></table>
        </div></div>
      <p class="note">Pass is the positive class. Youden's J = TPR + TNR − 1 = ${jx} (0 is chance, 1 is perfect). Raw agreement ${f(m.agreement)}${rare ? ', misleading here because failures are rare' : ''}. From the judge's saved verdicts and your exported HW5 labels.</p>
      ${d.labels_changed_since_export ? `<p class="warn">${d.labels_changed_since_export} label${d.labels_changed_since_export === 1 ? '' : 's'} on this split changed in the Labels tab since the HW5 export (marked below). Re-export (export_labels in analysis/run_judges.py) to update these numbers.</p>` : ''}
      ${m.no_label ? `<p class="warn">${m.no_label} conversation${m.no_label === 1 ? ' has' : 's have'} no label and ${m.no_label === 1 ? 'is' : 'are'} left out, so these numbers are not comparable to judge_alignment, which refuses such a split.</p>` : ''}
      <h3 class="count">${dis} disagreement${dis === 1 ? '' : 's'} to review</h3>
      <p class="sub">${kinds}. The judge read each conversation up to your labeled turn.${S.jv.dis && !dis ? ' Nothing to review on this split.' : ''}</p>
      ${rows.length ? `<table class="dis"><colgroup><col class="c-id"><col class="c-lab"><col class="c-j"><col><col></colgroup>
      <tr class="headrow"><th>Conversation</th><th>Your label</th><th>Judge</th><th>Judge critique</th><th>Your evidence</th></tr>
      ${rows.map(r => { const sid = r.scenario_id || ''; return `<tr class="${r.agree === false ? 'off' : ''}${S.jv.seen.has(sid) ? ' seen' : ''}" data-sid="${esc(sid)}">
        <td data-label="Conversation"><a href="${esc(reviewHref(sid))}" class="jv-open" data-sid="${esc(sid)}">${esc((sid || r.trace_id).replace(/^support-/, ''))}</a>${r.turn ? `<span class="turn">turn ${r.turn}</span>` : ''}</td>
        <td data-label="Your label">${tag(r.label)}<a class="jv-edit" href="${esc(labHref(r))}">Edit label</a>${r.label_changed ? '<span class="chg">Changed in Labels; re-export to recount.</span>' : ''}</td>
        <td data-label="Judge">${tag(r.verdict)}</td>
        <td class="txt" data-label="Judge critique">${crit(r.critique)}</td><td class="txt" data-label="Your evidence">${esc(r.evidence || '—')}</td></tr>`; }).join('')}</table>` : ''}`;
  }
  box.innerHTML = head + body;
  $('#jv-live').textContent = live.replace(/<[^>]+>/g, '');
  if (focusId) $('#' + focusId)?.focus();   // a re-render replaces the controls; keep keyboard focus where it was
  $('#jv-judge').onchange = e => { S.jv.judge = e.target.value; renderJudge(); };
  $('#jv-split').onchange = e => { S.jv.split = e.target.value; renderJudge(); };
  $('#jv-dis').onchange = e => { S.jv.dis = e.target.checked; renderJudge(); };
  /* A plain click opens the conversation in Review; a modified click follows the real href (new tab). */
  for (const a of box.querySelectorAll('a.jv-open')) a.onclick = e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
    e.preventDefault();
    const i = S.index.findIndex(x => x.scenario_id === a.dataset.sid);
    if (i < 0 || !mayLeave()) return;
    S.jv.last = a.dataset.sid; S.jv.seen.add(a.dataset.sid);
    openConv(i); document.querySelector('.tabs button[data-tab="review"]').click();
  };
  /* Back from a conversation: return to its row. */
  const back = S.jv.last && [...box.querySelectorAll('tr[data-sid]')].find(t => t.dataset.sid === S.jv.last);
  if (back){ back.scrollIntoView({block: 'center'}); S.jv.last = ''; }
}
/* Entering or leaving Labels is a history entry (Labels has its own hash), so back returns to the other
   tab. The push comes first: an already-loaded focus view renders synchronously and replaces the hash. */
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  const was = $('#labels').classList.contains('on'), to = b.dataset.tab === 'labels';
  if (to && !was) writeLabHash(true);
  setTab(b.dataset.tab);
  if (!to && was) writeHash(true);
});
$('#show-sugg').checked = S.showSugg;
$('#show-sugg').onchange = e => {
  S.showSugg = e.target.checked;
  try { localStorage.setItem('showSugg', S.showSugg ? '1' : '0'); } catch (err) {}
  if (S.view) renderConversation(snapshotDrafts());
};
function setAxial(on){
  S.showAxial = on;
  if (!on) S.pickerFor = null;       // no MODE rows, so no panel to reopen later
  $('#show-axial').checked = on;
  try { localStorage.setItem('showAxial', on ? '1' : '0'); } catch (err) {}
  renderPos();
}
$('#show-axial').checked = S.showAxial;
$('#show-axial').onchange = e => {
  setAxial(e.target.checked);
  if (S.view) renderConversation(snapshotDrafts());
};
/* prev/next step through the held list by scenario id, so they work when the
   open conversation is outside it (nothing open: next is the first row). */
$('#prev').onclick = () => {
  const p = navList().filter(i => sid(i) < sid(S.cur)).pop();
  if (p !== undefined && mayLeave()) openConv(p);
};
$('#next').onclick = () => {
  const n = navList().find(i => sid(i) > sid(S.cur));
  if (n !== undefined && mayLeave()) openConv(n);
};
document.addEventListener('keydown', e => {
  const rev = $('#review').classList.contains('on');
  /* Space and ? first: Space must never press a focused button, a mode card included. */
  if (!rev) return;   // only the open Review tab navigates conversations; Labels has its own handler
  if (!typingIn(e) && pageKeys(e, 'review', $('#conv'))) return;
  /* An open mode panel owns the keyboard: Esc closes it, nothing else navigates. */
  if (document.querySelector('#conv .modepick')){
    if (e.key === 'Escape'){ e.preventDefault(); setPicker(null); }
    return;
  }
  if (typingIn(e)) return;
  if ($('#labels').classList.contains('on')) return;   // the Labels tab has its own handler
  if (e.key === 'Escape' && !$('#keys').hidden){ $('#keys').hidden = true; return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;   // leave Cmd/Ctrl-F and friends to the browser
  const k = e.key.toLowerCase();
  if (k === 'j') $('#prev').click();
  else if (k === 'k') $('#next').click();
  else if (k === 'g') nextFailure();
});
boot();
</script>
